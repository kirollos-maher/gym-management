<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app-nav"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading-state" class="flex items-center justify-center h-96">
      <div class="spinner h-12 w-12"></div>
    </div>

    <div id="content" class="hidden space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Members</h1>
          <p class="text-sm text-gray-500">Manage your gym members and their subscriptions</p>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center gap-4 mb-6">
          <input type="text" id="search-input" placeholder="Search by name, email, or phone..."
            class="flex-1 rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button id="refresh-btn" class="rounded-lg border border-gray-300 px-4 py-2 hover:bg-gray-50">Refresh</button>
        </div>

        <div id="members-list" class="space-y-3"></div>

        <div id="count-label" class="mt-4 text-sm text-gray-500"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    let gymId = null;
    let allMembers = [];

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      renderNav(auth.user, 'members');
      gymId = auth.profile?.gym_id;

      await fetchMembers();
      document.getElementById('refresh-btn').addEventListener('click', fetchMembers);
      document.getElementById('search-input').addEventListener('input', (e) => renderMembers(e.target.value));
    }

    async function fetchMembers() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');

      const { data, error } = await sb
        .from('users')
        .select('*, subscription:subscriptions(*, membership:memberships(*))')
        .eq('gym_id', gymId)
        .eq('role', 'member')
        .order('created_at', { ascending: false });

      if (error) console.error('Error fetching members:', error);
      allMembers = data || [];

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      renderMembers(document.getElementById('search-input').value);
    }

    function renderMembers(searchTerm) {
      const term = (searchTerm || '').toLowerCase();
      const filtered = allMembers.filter((m) => {
        return (
          m.full_name?.toLowerCase().includes(term) ||
          m.email?.toLowerCase().includes(term) ||
          m.phone?.toLowerCase().includes(term)
        );
      });

      const el = document.getElementById('members-list');
      if (filtered.length === 0) {
        el.innerHTML = '<div class="text-center py-8 text-gray-500"><p>No members found</p></div>';
      } else {
        el.innerHTML = filtered
          .map((m) => {
            const sub = Array.isArray(m.subscription) ? m.subscription[0] : m.subscription;
            const isActive = sub?.status === 'active';
            return `
            <div class="flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 transition-colors">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">👤</div>
                <div>
                  <p class="font-medium text-gray-900">${m.full_name || 'Unknown Member'}</p>
                  <div class="flex items-center gap-3 text-sm text-gray-500">
                    <span>${m.email || 'No email'}</span>
                    ${m.phone ? `<span>${m.phone}</span>` : ''}
                  </div>
                </div>
              </div>
              <div class="text-left">
                ${
                  sub
                    ? `
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                    isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                  }">${isActive ? 'Active' : 'Inactive'}</span>
                  <p class="text-xs text-gray-500 mt-1">${sub.membership?.name || ''}</p>
                  <p class="text-xs text-gray-400">Expires ${formatDate(sub.end_date)}</p>
                `
                    : ''
                }
              </div>
            </div>`;
          })
          .join('');
      }

      document.getElementById('count-label').textContent = `Showing ${filtered.length} of ${allMembers.length} members`;
    }

    init();
  </script>
</body>
</html>
