<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app-nav"></div>

  <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading-state" class="flex items-center justify-center h-96">
      <div class="spinner h-12 w-12"></div>
    </div>

    <div id="content" class="hidden space-y-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800" data-i18n="settings.title">Settings</h1>
        <p class="text-sm text-gray-500" data-i18n="settings.desc">Manage your gym profile and preferences</p>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4" data-i18n="settings.gym.profile">Gym Profile</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="settings.gym.name">Gym Name</label>
            <input type="text" id="f-name" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="settings.address">Address</label>
            <input type="text" id="f-address" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="settings.phone">Phone Number</label>
            <input type="text" id="f-phone" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="settings.email">Email</label>
            <input type="email" id="f-email" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="settings.currency">Currency</label>
            <select id="f-currency" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="GBP">GBP (£)</option>
              <option value="EGP">EGP (ج.م)</option>
              <option value="SAR">SAR (ر.س)</option>
            </select>
          </div>
          <div class="pt-4 border-t flex items-center gap-3">
            <button id="save-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2" data-i18n="settings.save">Save Settings</button>
            <span id="msg" class="text-sm"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/language.js"></script>
  <script>
    let gymId = null;

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      
      // Render nav AFTER auth is confirmed
      renderNav(auth.user, 'settings');
      gymId = auth.profile?.gym_id;

      const gym = auth.profile?.gym || {};
      document.getElementById('f-name').value = gym.name || '';
      document.getElementById('f-address').value = gym.address || '';
      document.getElementById('f-phone').value = gym.phone || '';
      document.getElementById('f-email').value = gym.email || '';
      document.getElementById('f-currency').value = gym.currency || 'USD';

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      document.getElementById('save-btn').addEventListener('click', saveSettings);
      
      // Apply translations after page is ready
      setTimeout(updatePageLanguage, 100);
    }

    async function saveSettings() {
      const msgEl = document.getElementById('msg');
      const payload = {
        name: document.getElementById('f-name').value,
        address: document.getElementById('f-address').value,
        phone: document.getElementById('f-phone').value,
        email: document.getElementById('f-email').value,
        currency: document.getElementById('f-currency').value
      };

      const { error } = await sb.from('gym_profiles').update(payload).eq('id', gymId);
      msgEl.textContent = error ? 'Failed to save settings' : 'Settings saved successfully!';
      msgEl.className = `text-sm ${error ? 'text-red-600' : 'text-green-600'}`;
    }

    // Run init when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
