<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md overflow-hidden">
      <div class="px-6 py-4 border-b flex items-center justify-between">
        <h2 class="text-2xl font-semibold text-gray-900 text-center flex-1" data-i18n="auth.signin">Sign In</h2>
        <button id="lang-toggle" class="px-3 py-1 text-sm font-medium text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
          عربي
        </button>
      </div>
      <div class="px-6 py-4">
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.email">Email</label>
            <input type="email" id="email" required data-i18n-placeholder="auth.enter.email"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.password">Password</label>
            <input type="password" id="password" required data-i18n-placeholder="auth.enter.password"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-2 rounded-lg text-sm"></div>
          <button type="submit" id="submit-btn"
            class="w-full rounded-lg font-medium bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 flex items-center justify-center">
            <span data-i18n="auth.signin">Sign In</span>
          </button>
          <p class="text-center text-sm text-gray-500">
            <span data-i18n="auth.noaccount">Don't have an account?</span>
            <a href="signup.html" class="text-blue-600 hover:underline" data-i18n="auth.create">Create one</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/language.js"></script>
  
  <script>
    // ============================================
    // زر تغيير اللغة
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      const langToggle = document.getElementById('lang-toggle');
      
      if (langToggle) {
        langToggle.addEventListener('click', function(e) {
          e.preventDefault();
          const currentLang = localStorage.getItem('gym_lang') || 'en';
          const newLang = currentLang === 'ar' ? 'en' : 'ar';
          localStorage.setItem('gym_lang', newLang);
          document.documentElement.dir = newLang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.lang = newLang;
          updatePageLanguage();
          updateLanguageToggle();
        });
      }
      
      updatePageLanguage();
    });

    // ============================================
    // نموذج تسجيل الدخول
    // ============================================
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error-box');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner h-5 w-5"></div>';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errorBox.textContent = error.message;
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span data-i18n="auth.signin">Sign In</span>';
        updatePageLanguage();
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
