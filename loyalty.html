<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loyalty - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .setting-hint {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.25rem;
      padding-right: 0.25rem;
      border-right: 3px solid #93c5fd;
      padding-right: 0.75rem;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      border-radius: 8px;
      color: white;
      z-index: 9999;
      animation: slideUp 0.3s ease;
      max-width: 400px;
      font-size: 14px;
    }
    .toast-success { background: #10b981; }
    .toast-error { background: #ef4444; }
    .toast-info { background: #3b82f6; }
    @keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <script>
    // تطبيق Dark Mode فوراً عند تحميل الصفحة
    (function() {
      const isDark = localStorage.getItem('gym_theme') === 'dark';
      if (isDark) {
        document.body.classList.add('dark-mode');
      }
    })();
  </script>

  <div id="app-nav"></div>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading-state" class="flex items-center justify-center h-96">
      <div class="spinner h-12 w-12"></div>
    </div>
    <div id="content" class="hidden space-y-6"></div>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/language.js"></script>
  <script>
    let gymId, userId, role;
    let currencySymbol = '$';

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      
      renderNav(auth.user, 'loyalty');
      gymId = auth.profile?.gym_id;
      userId = auth.user.id;
      role = auth.profile?.role;
      
      const currency = await getGymCurrency();
      currencySymbol = getCurrencySymbol(currency);

      document.getElementById('loading-state').classList.add('hidden');
      const content = document.getElementById('content');
      content.classList.remove('hidden');

      const lang = localStorage.getItem('gym_lang') || 'en';
      
      if (role === 'gym_owner' || role === 'super_admin') {
        content.innerHTML = `
          <div>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white" data-i18n="loyalty.title">Loyalty Program</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400" data-i18n="loyalty.desc">Manage loyalty points settings and view member activity</p>
          </div>
          <div id="settings-panel" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6"></div>
        `;
        await renderSettingsPanel();
      } else if (role === 'member') {
        content.innerHTML = `
          <div>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white" data-i18n="loyalty.my.title">My Loyalty Points</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400" data-i18n="loyalty.my.desc">Track your points and redeem rewards</p>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="space-y-6">
              <div id="balance-card"></div>
              <div id="redeem-card" class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6"></div>
            </div>
            <div id="history-card"></div>
          </div>
        `;
        await renderMemberView();
      } else {
        content.innerHTML = `<div class="text-center py-12 text-gray-500 dark:text-gray-400" data-i18n="loyalty.noaccess">You don't have access to loyalty features</div>`;
      }
      
      if (typeof updatePageLanguage === 'function') {
        setTimeout(updatePageLanguage, 100);
      }
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast toast-${type}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    async function getMemberBalance(memberId) {
      const { data } = await sb
        .from('loyalty_transactions')
        .select('points, transaction_type')
        .eq('member_id', memberId)
        .eq('gym_id', gymId);

      return (data || []).reduce(
        (bal, t) => (t.transaction_type === 'earned' ? bal + t.points : bal - t.points),
        0
      );
    }

    async function getMemberHistory(memberId, limit = 50) {
      const { data } = await sb
        .from('loyalty_transactions')
        .select('*')
        .eq('member_id', memberId)
        .eq('gym_id', gymId)
        .order('created_at', { ascending: false })
        .limit(limit);
      return data || [];
    }

    function historyHtml(transactions) {
      const lang = localStorage.getItem('gym_lang') || 'en';
      const noHistoryText = lang === 'ar' ? 'لا توجد معاملات ولاء حتى الآن' : 'No loyalty transactions yet';
      const historyTitle = lang === 'ar' ? 'سجل المعاملات' : 'Transaction History';
      const historyDesc = lang === 'ar' ? 'نشاط نقاط الولاء الأخير' : 'Recent loyalty point activity';
      const earnedText = lang === 'ar' ? 'مكتسب' : 'Earned';
      const redeemedText = lang === 'ar' ? 'مستبدل' : 'Redeemed';
      
      if (!transactions.length) {
        return `<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 text-center text-gray-500 dark:text-gray-400">
          <p>${noHistoryText}</p>
        </div>`;
      }
      
      const labels = { 
        attendance: lang === 'ar' ? 'حضور' : 'Attendance', 
        renewal: lang === 'ar' ? 'تجديد' : 'Renewal', 
        canteen: lang === 'ar' ? 'كافيتيريا' : 'Canteen', 
        manual: lang === 'ar' ? 'يدوي' : 'Manual' 
      };
      
      return `
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-1">${historyTitle}</h3>
          <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">${historyDesc}</p>
          <div class="space-y-3">
            ${transactions
              .map((t) => {
                const earned = t.transaction_type === 'earned';
                const statusText = earned ? earnedText : redeemedText;
                const statusClass = earned ? 'bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-400' : 'bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-400';
                return `
              <div class="flex items-center justify-between p-3 rounded-lg border border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center ${earned ? 'bg-green-100 dark:bg-green-900/30' : 'bg-red-100 dark:bg-red-900/30'}">
                    ${earned ? '⬆️' : '⬇️'}
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="font-medium text-gray-900 dark:text-white">${labels[t.source] || t.source}</span>
                      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusClass}">${statusText}</span>
                    </div>
                    <div class="text-xs text-gray-500 dark:text-gray-400">${formatDateTime(t.created_at)}</div>
                    ${t.description ? `<p class="text-xs text-gray-400 dark:text-gray-500 mt-1">${t.description}</p>` : ''}
                  </div>
                </div>
                <div class="text-lg font-bold ${earned ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                  ${earned ? '+' : '-'}${t.points}
                </div>
              </div>`;
              })
              .join('')}
          </div>
        </div>`;
    }

    async function renderMemberView() {
      const [balance, history] = await Promise.all([getMemberBalance(userId), getMemberHistory(userId)]);

      const lang = localStorage.getItem('gym_lang') || 'en';
      const pointsText = lang === 'ar' ? 'نقاط الولاء' : 'Loyalty Points';
      const earnText = lang === 'ar' ? '⭐ اكسب نقاط مع تسجيل الحضور' : '⭐ Earn points with check-ins';
      const redeemText = lang === 'ar' ? 'استبدال النقاط' : 'Redeem Points';
      const redeemPlaceholder = lang === 'ar' ? 'النقاط المراد استبدالها' : 'Points to redeem';
      const redeemBtnText = lang === 'ar' ? 'استبدال' : 'Redeem';

      document.getElementById('balance-card').innerHTML = `
        <div class="bg-gradient-to-br from-yellow-50 to-orange-50 dark:from-yellow-900/20 dark:to-orange-900/20 border border-yellow-200 dark:border-yellow-800 rounded-lg shadow-md p-6">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-sm font-medium text-yellow-800 dark:text-yellow-400">${pointsText}</p>
              <p class="text-4xl font-bold text-yellow-900 dark:text-yellow-300 mt-1">${balance.toLocaleString()}</p>
              <p class="text-xs text-yellow-700 dark:text-yellow-500 mt-3">${earnText}</p>
            </div>
            <div class="p-3 bg-yellow-200 dark:bg-yellow-800 rounded-full text-3xl">⭐</div>
          </div>
        </div>`;

      document.getElementById('redeem-card').innerHTML = `
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">${redeemText}</h3>
        <div class="flex gap-2">
          <input type="number" min="1" id="redeem-amount" placeholder="${redeemPlaceholder}"
            class="flex-1 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button id="redeem-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2">${redeemBtnText}</button>
        </div>
        <p id="redeem-msg" class="text-sm mt-2"></p>
      `;

      document.getElementById('history-card').innerHTML = historyHtml(history);

      document.getElementById('redeem-btn').addEventListener('click', async () => {
        const amount = Number(document.getElementById('redeem-amount').value);
        const msgEl = document.getElementById('redeem-msg');
        
        const lang = localStorage.getItem('gym_lang') || 'en';
        const enterValidText = lang === 'ar' ? 'أدخل مبلغًا صالحًا' : 'Enter a valid amount';
        const insufficientText = lang === 'ar' ? 'نقاط غير كافية. المتاح: ' : 'Insufficient points. Available: ';
        const failedText = lang === 'ar' ? 'فشل استبدال النقاط' : 'Failed to redeem points';
        const successText = lang === 'ar' ? 'تم استبدال النقاط بنجاح!' : 'Points redeemed successfully!';
        
        if (!amount || amount <= 0) {
          msgEl.textContent = enterValidText;
          msgEl.className = 'text-sm mt-2 text-red-600 dark:text-red-400';
          return;
        }
        const currentBalance = await getMemberBalance(userId);
        if (currentBalance < amount) {
          msgEl.textContent = insufficientText + currentBalance;
          msgEl.className = 'text-sm mt-2 text-red-600 dark:text-red-400';
          return;
        }
        const { error } = await sb.from('loyalty_transactions').insert({
          member_id: userId,
          gym_id: gymId,
          points: amount,
          transaction_type: 'redeemed',
          source: 'manual',
          description: `Redeemed ${amount} points`
        });
        if (error) {
          msgEl.textContent = failedText;
          msgEl.className = 'text-sm mt-2 text-red-600 dark:text-red-400';
          return;
        }
        msgEl.textContent = successText;
        msgEl.className = 'text-sm mt-2 text-green-600 dark:text-green-400';
        await renderMemberView();
        if (typeof updatePageLanguage === 'function') {
          setTimeout(updatePageLanguage, 50);
        }
      });
    }

    async function renderSettingsPanel() {
      const { data: settings } = await sb.from('loyalty_settings').select('*').eq('gym_id', gymId).single();

      const values = settings || {
        points_per_checkin: 0,
        points_per_renewal_currency: 0,
        points_per_canteen_purchase: 0,
        points_redemption_rate: 0
      };

      const lang = localStorage.getItem('gym_lang') || 'en';
      
      const settingsTitle = lang === 'ar' ? 'إعدادات نقاط الولاء' : 'Loyalty Points Settings';
      const settingsDesc = lang === 'ar' ? 'تكوين كيفية كسب الأعضاء واستبدال نقاط الولاء' : 'Configure how members earn and redeem loyalty points';
      
      const checkinLabel = lang === 'ar' ? 'نقاط لكل تسجيل حضور' : 'Points per Check-in';
      const checkinHint = lang === 'ar' 
        ? '💡 كل مرة يسجل فيها العضو حضوره، يحصل على هذا العدد من النقاط. مثال: لو حطيت 5، كل عضو يسجل حضور ياخد 5 نقاط.'
        : '💡 Each time a member checks in, they earn this many points. Example: If you set 5, each check-in gives 5 points.';
      
      const renewalLabel = lang === 'ar' ? 'نقاط لكل وحدة عملة عند التجديد' : 'Points per Currency Unit on Renewal';
      const renewalHint = lang === 'ar'
        ? '💡 كلما جدد العضو اشتراكه، يحصل على نقاط مقابل كل وحدة عملة يدفعها. مثال: لو حطيت 2 وسعر التجديد 100 جنيه، ياخد 200 نقطة.'
        : '💡 When a member renews their subscription, they earn points for each currency unit paid. Example: If you set 2 and renewal costs $100, they get 200 points.';
      
      const canteenLabel = lang === 'ar' ? 'نقاط لكل وحدة عملة عند شراء من الكافتيريا' : 'Points per Currency Unit on Canteen Purchase';
      const canteenHint = lang === 'ar'
        ? '💡 كلما اشترى العضو منتجات من الكافتيريا، يحصل على نقاط مقابل كل وحدة عملة يدفعها. مثال: لو حطيت 3 واشترى بـ 50 جنيه، ياخد 150 نقطة.'
        : '💡 When a member buys from the canteen, they earn points for each currency unit spent. Example: If you set 3 and they spend $50, they get 150 points.';
      
      const redemptionLabel = lang === 'ar' ? 'معدل استبدال النقاط' : 'Points Redemption Rate';
      const redemptionHint = lang === 'ar'
        ? '💡 قيمة كل نقطة عند استبدالها بالعملة. مثال: لو حطيت 0.5، كل 100 نقطة = 50 جنيه قيمة خصم أو منتج.'
        : '💡 The value of each point when redeemed. Example: If you set 0.5, every 100 points = $50 in discount or products.';
      
      const saveBtnText = lang === 'ar' ? 'حفظ الإعدادات' : 'Save Settings';

      document.getElementById('settings-panel').innerHTML = `
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-1">${settingsTitle}</h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">${settingsDesc}</p>
        <div class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${checkinLabel}</label>
            <input type="number" min="0" id="s-checkin" value="${values.points_per_checkin}"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p class="setting-hint dark:text-gray-400">${checkinHint}</p>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${renewalLabel}</label>
            <input type="number" min="0" step="0.01" id="s-renewal" value="${values.points_per_renewal_currency}"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p class="setting-hint dark:text-gray-400">${renewalHint}</p>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${canteenLabel}</label>
            <input type="number" min="0" step="0.01" id="s-canteen" value="${values.points_per_canteen_purchase}"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p class="setting-hint dark:text-gray-400">${canteenHint}</p>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${redemptionLabel}</label>
            <input type="number" min="0" step="0.01" id="s-redemption" value="${values.points_redemption_rate}"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p class="setting-hint dark:text-gray-400">${redemptionHint}</p>
          </div>
          
          <div class="pt-4 border-t border-gray-200 dark:border-gray-700 flex items-center gap-3">
            <button id="save-settings-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2">${saveBtnText}</button>
            <span id="save-msg" class="text-sm"></span>
          </div>
        </div>
      `;

      document.getElementById('save-settings-btn').addEventListener('click', async () => {
        const msgEl = document.getElementById('save-msg');
        const lang = localStorage.getItem('gym_lang') || 'en';
        const savedText = lang === 'ar' ? 'تم حفظ الإعدادات بنجاح!' : 'Settings saved successfully!';
        const failedText = lang === 'ar' ? 'فشل حفظ الإعدادات' : 'Failed to save settings';
        
        const payload = {
          gym_id: gymId,
          points_per_checkin: Number(document.getElementById('s-checkin').value) || 0,
          points_per_renewal_currency: Number(document.getElementById('s-renewal').value) || 0,
          points_per_canteen_purchase: Number(document.getElementById('s-canteen').value) || 0,
          points_redemption_rate: Number(document.getElementById('s-redemption').value) || 0,
          updated_at: new Date().toISOString()
        };
        const { error } = await sb.from('loyalty_settings').upsert(payload, { onConflict: 'gym_id' });
        msgEl.textContent = error ? failedText : savedText;
        msgEl.className = `text-sm ${error ? 'text-red-600 dark:text-red-400' : 'text-green-600 dark:text-green-400'}`;
        if (!error) showToast(savedText, 'success');
      });
      
      if (typeof updatePageLanguage === 'function') {
        setTimeout(updatePageLanguage, 50);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
