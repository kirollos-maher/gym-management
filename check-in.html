<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-In - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app-nav"></div>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Member Check-In</h1>

    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="border-b bg-gradient-to-l from-blue-50 to-indigo-50 px-6 py-4">
        <h2 class="text-xl font-bold text-gray-800">Manual Check-In</h2>
        <p class="text-sm text-gray-500">Search by name, email, or phone number</p>
      </div>

      <div class="p-6 space-y-6">
        <!-- Search state -->
        <div id="search-state" class="space-y-4">
          <input type="text" id="search-input" placeholder="Search by name, email, or phone..."
            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <div id="search-loading" class="hidden flex items-center justify-center py-4 gap-2 text-gray-600">
            <div class="spinner h-5 w-5"></div> Searching...
          </div>
          <div id="search-results" class="border rounded-lg overflow-hidden divide-y hidden"></div>
          <div id="no-results" class="hidden text-center py-8 text-gray-500">
            No members found. Try a different search term.
          </div>
        </div>

        <!-- Selected member state -->
        <div id="selected-state" class="hidden">
          <div class="p-6 border-2 border-blue-200 bg-blue-50 rounded-lg">
            <div class="flex items-start justify-between">
              <div class="flex items-start gap-4">
                <div id="selected-avatar" class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center text-white text-2xl font-bold"></div>
                <div>
                  <h3 id="selected-name" class="text-xl font-semibold text-gray-900"></h3>
                  <p id="selected-email" class="text-sm text-gray-600"></p>
                  <span id="selected-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium mt-2"></span>
                </div>
              </div>
              <button id="change-member-btn" class="text-sm text-gray-500 hover:text-gray-700">Change Member</button>
            </div>
            <div class="mt-4">
              <button id="checkin-btn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2 flex items-center justify-center gap-2">
                <span>Check In</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Result state -->
        <div id="result-state" class="hidden"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    let gymId = null;
    let selectedMember = null;
    let searchTimeout = null;

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      renderNav(auth.user, 'check-in');
      gymId = auth.profile?.gym_id;

      document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const term = e.target.value;
        searchTimeout = setTimeout(() => searchMembers(term), 300);
      });

      document.getElementById('change-member-btn').addEventListener('click', resetSelection);
    }

    async function searchMembers(term) {
      const resultsEl = document.getElementById('search-results');
      const loadingEl = document.getElementById('search-loading');
      const noResultsEl = document.getElementById('no-results');

      if (!term || term.trim().length < 2) {
        resultsEl.classList.add('hidden');
        noResultsEl.classList.add('hidden');
        return;
      }

      loadingEl.classList.remove('hidden');
      resultsEl.classList.add('hidden');
      noResultsEl.classList.add('hidden');

      const { data } = await sb
        .from('users')
        .select('*, subscription:subscriptions(*, membership:memberships(*))')
        .or(`full_name.ilike.%${term}%,email.ilike.%${term}%,phone.ilike.%${term}%`)
        .eq('role', 'member')
        .limit(10);

      loadingEl.classList.add('hidden');

      if (!data || data.length === 0) {
        noResultsEl.classList.remove('hidden');
        return;
      }

      resultsEl.classList.remove('hidden');
      resultsEl.innerHTML = data
        .map((m, i) => {
          const sub = Array.isArray(m.subscription) ? m.subscription[0] : m.subscription;
          const isActive = sub?.status === 'active';
          return `
          <div class="p-4 hover:bg-gray-50 cursor-pointer transition-colors" data-index="${i}">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">👤</div>
                <div>
                  <p class="font-medium text-gray-900">${m.full_name || 'Unknown Member'}</p>
                  <p class="text-sm text-gray-500">${m.email || 'No email'}</p>
                </div>
              </div>
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
              }">${isActive ? 'Active' : 'Inactive'}</span>
            </div>
          </div>`;
        })
        .join('');

      resultsEl.querySelectorAll('[data-index]').forEach((node) => {
        node.addEventListener('click', () => selectMember(data[Number(node.dataset.index)]));
      });
    }

    function selectMember(member) {
      selectedMember = member;
      document.getElementById('search-state').classList.add('hidden');
      document.getElementById('result-state').classList.add('hidden');
      document.getElementById('selected-state').classList.remove('hidden');

      const sub = Array.isArray(member.subscription) ? member.subscription[0] : member.subscription;
      const isActive = sub?.status === 'active';

      document.getElementById('selected-avatar').textContent = getInitials(member.full_name);
      document.getElementById('selected-name').textContent = member.full_name || 'Unknown Member';
      document.getElementById('selected-email').textContent = member.email || 'No email';
      const statusEl = document.getElementById('selected-status');
      statusEl.textContent = isActive ? 'Active Member' : 'Inactive';
      statusEl.className = `inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium mt-2 ${
        isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
      }`;

      document.getElementById('checkin-btn').onclick = () => performCheckIn(member);
    }

    function resetSelection() {
      selectedMember = null;
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').classList.add('hidden');
      document.getElementById('selected-state').classList.add('hidden');
      document.getElementById('result-state').classList.add('hidden');
      document.getElementById('search-state').classList.remove('hidden');
    }

    async function hasActiveSubscription(userId) {
      const today = new Date().toISOString().split('T')[0];
      const { data } = await sb
        .from('subscriptions')
        .select('id, end_date, status')
        .eq('member_id', userId)
        .eq('status', 'active')
        .gte('end_date', today)
        .order('end_date', { ascending: false })
        .limit(1)
        .single();
      return !!data;
    }

    async function performCheckIn(member) {
      const btn = document.getElementById('checkin-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner h-5 w-5"></div>';

      const active = await hasActiveSubscription(member.id);
      if (!active) {
        showResult(false, 'Member does not have an active subscription.');
        return;
      }

      const { data: existing } = await sb
        .from('attendance_logs')
        .select('*')
        .eq('user_id', member.id)
        .is('check_out_time', null)
        .order('check_in_time', { ascending: false })
        .limit(1);

      if (existing && existing.length > 0) {
        showResult(false, 'This member is already checked in.');
        return;
      }

      const { data: checkIn, error } = await sb
        .from('attendance_logs')
        .insert({ user_id: member.id, gym_id: gymId, method: 'manual', type: 'member' })
        .select()
        .single();

      if (error || !checkIn) {
        showResult(false, 'Failed to process check-in. Please try again.');
        return;
      }

      showResult(true, null, member, checkIn.check_in_time);
    }

    function showResult(success, errorMessage, member, checkInTime) {
      document.getElementById('selected-state').classList.add('hidden');
      const resultEl = document.getElementById('result-state');
      resultEl.classList.remove('hidden');

      if (success) {
        resultEl.innerHTML = `
          <div class="p-6 border-2 border-green-200 bg-gradient-to-br from-green-50 to-emerald-50 rounded-lg text-center">
            <div class="w-20 h-20 rounded-full bg-green-500 flex items-center justify-center mx-auto mb-4 text-4xl">✅</div>
            <h2 class="text-2xl font-bold text-green-800 mb-2">Check-In Successful!</h2>
            <p class="text-green-700 mb-4">${member.full_name || 'Member'} — ${new Date(checkInTime).toLocaleTimeString()}</p>
            <button id="new-checkin-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-6 py-2">
              New Check-In
            </button>
          </div>`;
      } else {
        resultEl.innerHTML = `
          <div class="p-6 border-2 border-red-200 bg-red-50 rounded-lg text-center">
            <div class="w-20 h-20 rounded-full bg-red-500 flex items-center justify-center mx-auto mb-4 text-4xl">❌</div>
            <h2 class="text-2xl font-bold text-red-800 mb-2">Check-In Failed</h2>
            <p class="text-red-700 mb-4">${errorMessage}</p>
            <button id="new-checkin-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-6 py-2">
              Try Again
            </button>
          </div>`;
      }

      document.getElementById('new-checkin-btn').addEventListener('click', resetSelection);
    }

    init();
  </script>
</body>
</html>
