<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Make Tailwind's dark: utilities follow OUR light/dark toggle
    // (the dark-mode class on <body>), not the OS/browser color scheme.
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-md overflow-hidden">
      <div class="px-6 py-4 border-b flex items-center justify-between">
        <h2 class="text-2xl font-semibold text-gray-900 text-center flex-1" data-i18n="auth.signup">Create Your Gym Account</h2>
        <button id="lang-toggle" class="px-3 py-1 text-sm font-medium text-blue-600 border border-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
          عربي
        </button>
      </div>
      <div class="px-6 py-4">
        <form id="signup-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.gymname">Gym Name</label>
            <input type="text" id="gym-name" required data-i18n-placeholder="auth.enter.gymname"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.fullname">Your Full Name</label>
            <input type="text" id="full-name" required data-i18n-placeholder="auth.enter.fullname"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.email">Email</label>
            <input type="email" id="email" required data-i18n-placeholder="auth.enter.email"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="auth.password">Password</label>
            <input type="password" id="password" required minlength="6" data-i18n-placeholder="auth.password.min"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p class="text-xs text-gray-500 mt-1" data-i18n="auth.password.min">At least 6 characters</p>
          </div>
          <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-2 rounded-lg text-sm"></div>
          <button type="submit" id="submit-btn"
            class="w-full rounded-lg font-medium bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 flex items-center justify-center">
            <span data-i18n="auth.signup">Create Account</span>
          </button>
          <p class="text-center text-sm text-gray-500">
            <span data-i18n="auth.haveaccount">Already have an account?</span>
            <a href="login.html" class="text-blue-600 hover:underline" data-i18n="auth.signin.link">Sign in</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/language.js"></script>
  
  <script>
    // ============================================
    // زر تغيير اللغة - إعادة تحميل الصفحة
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      const langToggle = document.getElementById('lang-toggle');
      
      if (langToggle) {
        langToggle.addEventListener('click', function(e) {
          e.preventDefault();
          const currentLang = localStorage.getItem('gym_lang') || 'en';
          const newLang = currentLang === 'ar' ? 'en' : 'ar';
          localStorage.setItem('gym_lang', newLang);
          window.location.reload();
        });
      }
      
      updatePageLanguage();
    });

    // ============================================
    // نموذج التسجيل
    // ============================================
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error-box');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner h-5 w-5"></div>';

      const gymName = document.getElementById('gym-name').value;
      const fullName = document.getElementById('full-name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const showError = (msg) => {
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span data-i18n="auth.signup">Create Account</span>';
        updatePageLanguage();
      };

      try {
        const { data: signUpData, error: signUpError } = await sb.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName } }
        });

        if (signUpError) {
          console.error('SignUp error:', signUpError);
          return showError(signUpError.message);
        }

        if (!signUpData?.session) {
          return showError(
            'Account created, but no session was returned. If email confirmation is enabled, please confirm your email before signing in.'
          );
        }

        const { data: gymData, error: rpcError } = await sb.rpc('create_gym_owner_account', {
          p_gym_name: gymName,
          p_full_name: fullName
        });

        if (rpcError) {
          console.error('RPC error:', rpcError);
          return showError('Error creating gym: ' + rpcError.message);
        }

        console.log('✅ Gym created with ID:', gymData);
        window.location.href = 'dashboard.html';

      } catch (err) {
        console.error('Unexpected error:', err);
        showError(err instanceof Error ? err.message : 'An unexpected error occurred');
      }
    });
  </script>
</body>
</html>
