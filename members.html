<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app-nav"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading-state" class="flex items-center justify-center h-96">
      <div class="spinner h-12 w-12"></div>
    </div>

    <div id="content" class="hidden space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Members</h1>
          <p class="text-sm text-gray-500">Manage your gym members and their subscriptions</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button id="add-member-btn" class="bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium px-4 py-2 flex items-center gap-2">
            ➕ Add Member
          </button>
          <a href="canteen.html" class="bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium px-4 py-2 flex items-center gap-2">
            🛒 Canteen
          </a>
          <button id="refresh-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium px-4 py-2 flex items-center gap-2">
            🔄 Refresh
          </button>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center gap-4 mb-6 flex-wrap">
          <input type="text" id="search-input" placeholder="Search by name, email, or phone..."
            class="flex-1 min-w-[200px] rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <select id="status-filter" class="rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="all">All Members</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="expired">Expired</option>
          </select>
        </div>

        <div id="members-list" class="space-y-3"></div>

        <div id="count-label" class="mt-4 text-sm text-gray-500"></div>
      </div>
    </div>
  </main>

  <!-- Modal: Add Member -->
  <div id="add-member-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">➕ Add New Member</h2>
        <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>
      <form id="add-member-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
          <input type="text" id="new-fullname" required class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="new-email" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input type="tel" id="new-phone" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password *</label>
          <input type="password" id="new-password" required minlength="6" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <p class="text-xs text-gray-500 mt-1">At least 6 characters</p>
        </div>
        
        <!-- Membership Plan Selection -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Membership Plan</label>
          <select id="new-membership" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- Select a plan --</option>
          </select>
          <div id="plan-details" class="mt-2 text-sm text-gray-500 hidden"></div>
        </div>

        <!-- Custom Duration -->
        <div id="custom-duration-section" class="hidden">
          <label class="block text-sm font-medium text-gray-700 mb-1">Custom Duration (Months)</label>
          <input type="number" id="custom-duration" min="0.5" step="0.5" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <p class="text-xs text-gray-500 mt-1">Enter custom duration in months (e.g., 1, 3, 6, 12)</p>
          <div class="mt-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Custom Price</label>
            <input type="number" id="custom-price" min="0" step="0.01" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <p class="text-xs text-gray-500 mt-1">Enter price for this custom plan</p>
          </div>
        </div>

        <div class="border-t pt-4 flex gap-3">
          <button type="button" id="cancel-add-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-medium px-4 py-2">Cancel</button>
          <button type="submit" id="submit-add-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2">Add Member</button>
        </div>
        <div id="add-msg" class="text-sm hidden"></div>
      </form>
    </div>
  </div>

  <!-- Modal: Member Details -->
  <div id="member-details-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">👤 Member Details</h2>
        <button id="close-details-btn" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>
      <div id="member-details-content"></div>
    </div>
  </div>

  <!-- Modal: Member QR -->
  <div id="member-qr-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 text-center">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">📱 Member QR Code</h2>
        <button id="close-qr-modal" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
      </div>
      <div id="member-qr-display" class="flex flex-col items-center p-4">
        <div id="member-qr-canvas"></div>
        <p id="qr-member-name" class="font-semibold text-gray-800 mt-4"></p>
        <p id="qr-member-email" class="text-sm text-gray-500"></p>
        <p id="qr-code-text" class="text-xs font-mono text-gray-400 mt-2 break-all"></p>
        <button id="download-qr-btn" class="mt-4 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium px-4 py-2">
          📥 Download QR
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/language.js"></script>
  <script>
    let gymId = null;
    let allMembers = [];
    let memberships = [];
    let currentQrMemberId = null;

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      renderNav(auth.user, 'members');
      gymId = auth.profile?.gym_id;

      await loadMemberships();
      await fetchMembers();
      
      // Event Listeners
      document.getElementById('refresh-btn').addEventListener('click', fetchMembers);
      document.getElementById('search-input').addEventListener('input', (e) => renderMembers(e.target.value));
      document.getElementById('status-filter').addEventListener('change', () => renderMembers(document.getElementById('search-input').value));
      
      // Add Member Modal
      document.getElementById('add-member-btn').addEventListener('click', () => {
        document.getElementById('add-member-modal').classList.remove('hidden');
        populateMembershipSelect();
        document.getElementById('add-msg').classList.add('hidden');
        document.getElementById('add-member-form').reset();
        document.getElementById('plan-details').classList.add('hidden');
        document.getElementById('custom-duration-section').classList.add('hidden');
      });
      document.getElementById('close-modal-btn').addEventListener('click', () => {
        document.getElementById('add-member-modal').classList.add('hidden');
        document.getElementById('add-msg').classList.add('hidden');
        document.getElementById('add-member-form').reset();
      });
      document.getElementById('cancel-add-btn').addEventListener('click', () => {
        document.getElementById('add-member-modal').classList.add('hidden');
        document.getElementById('add-msg').classList.add('hidden');
        document.getElementById('add-member-form').reset();
      });
      document.getElementById('add-member-form').addEventListener('submit', addMember);
      
      // Membership select change - show details
      document.getElementById('new-membership').addEventListener('change', showPlanDetails);
      
      // Details Modal
      document.getElementById('close-details-btn').addEventListener('click', () => {
        document.getElementById('member-details-modal').classList.add('hidden');
      });
      
      // QR Modal
      document.getElementById('close-qr-modal').addEventListener('click', () => {
        document.getElementById('member-qr-modal').classList.add('hidden');
      });
      document.getElementById('download-qr-btn').addEventListener('click', downloadMemberQR);
      
      setTimeout(updatePageLanguage, 100);
    }

    async function loadMemberships() {
      const { data, error } = await sb
        .from('memberships')
        .select('*')
        .eq('gym_id', gymId)
        .order('duration_months', { ascending: true });
      
      if (error) console.error('Error loading memberships:', error);
      memberships = data || [];
      
      // If no memberships exist, create default ones
      if (memberships.length === 0) {
        await createDefaultMemberships();
        const { data: newData } = await sb
          .from('memberships')
          .select('*')
          .eq('gym_id', gymId)
          .order('duration_months', { ascending: true });
        memberships = newData || [];
      }
    }

    async function createDefaultMemberships() {
      const defaultPlans = [
        { name: 'شهري', description: 'اشتراك شهري', price: 50, duration_months: 1, perks: ['دخول غير محدود', 'خزانة مجانية'] },
        { name: 'نصف شهري', description: 'اشتراك 15 يوم', price: 30, duration_months: 0.5, perks: ['دخول غير محدود'] },
        { name: 'ربع سنوي', description: 'اشتراك 3 شهور', price: 130, duration_months: 3, perks: ['دخول غير محدود', 'خصم 10% كافتيريا'] },
        { name: 'نصف سنوي', description: 'اشتراك 6 شهور', price: 225, duration_months: 6, perks: ['دخول غير محدود', 'خصم 15% كافتيريا', 'جلسة تدريب'] },
        { name: 'سنوي', description: 'اشتراك سنة كاملة', price: 420, duration_months: 12, perks: ['دخول غير محدود', 'خصم 20% كافتيريا', 'VIP'] }
      ];

      for (const plan of defaultPlans) {
        await sb
          .from('memberships')
          .insert({
            gym_id: gymId,
            name: plan.name,
            description: plan.description,
            price: plan.price,
            duration_months: plan.duration_months,
            perks: plan.perks
          });
      }
    }

    function populateMembershipSelect() {
      const select = document.getElementById('new-membership');
      select.innerHTML = '<option value="">-- Select a plan --</option>';
      
      memberships.forEach(m => {
        const durationText = m.duration_months === 1 ? 'شهر' : 
                            m.duration_months === 0.5 ? 'نصف شهر' :
                            m.duration_months === 3 ? 'ربع سنوي' :
                            m.duration_months === 6 ? 'نصف سنوي' :
                            m.duration_months === 12 ? 'سنوي' :
                            `${m.duration_months} شهور`;
        select.innerHTML += `<option value="${m.id}">${m.name} - $${m.price} (${durationText})</option>`;
      });
      select.innerHTML += '<option value="custom">📝 Custom Plan</option>';
    }

    function showPlanDetails() {
      const select = document.getElementById('new-membership');
      const detailsEl = document.getElementById('plan-details');
      const customSection = document.getElementById('custom-duration-section');
      
      if (select.value === 'custom') {
        detailsEl.classList.add('hidden');
        customSection.classList.remove('hidden');
        return;
      }
      
      customSection.classList.add('hidden');
      
      if (select.value) {
        const plan = memberships.find(m => m.id === select.value);
        if (plan) {
          const durationText = plan.duration_months === 1 ? 'شهر' : 
                              plan.duration_months === 0.5 ? 'نصف شهر' :
                              plan.duration_months === 3 ? 'ربع سنوي' :
                              plan.duration_months === 6 ? 'نصف سنوي' :
                              plan.duration_months === 12 ? 'سنوي' :
                              `${plan.duration_months} شهور`;
          detailsEl.innerHTML = `
            <div class="bg-blue-50 p-3 rounded-lg">
              <p><strong>Price:</strong> $${plan.price}</p>
              <p><strong>Duration:</strong> ${durationText}</p>
              ${plan.perks ? `<p><strong>Perks:</strong> ${plan.perks.join(', ')}</p>` : ''}
            </div>
          `;
          detailsEl.classList.remove('hidden');
        }
      } else {
        detailsEl.classList.add('hidden');
      }
    }

    // ============================================================
    // ADD MEMBER - مع دعم الخطة المخصصة
    // ============================================================
    async function addMember(e) {
      e.preventDefault();
      const msgEl = document.getElementById('add-msg');
      const submitBtn = document.getElementById('submit-add-btn');
      
      msgEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Creating...';

      const fullName = document.getElementById('new-fullname').value;
      const email = document.getElementById('new-email').value || null;
      const phone = document.getElementById('new-phone').value || null;
      const password = document.getElementById('new-password').value;
      const membershipValue = document.getElementById('new-membership').value;
      let membershipId = null;

      // ==========================================================
      // Handle custom plan - استخدام الدالة الآمنة
      // ==========================================================
      if (membershipValue === 'custom') {
        const customDuration = parseFloat(document.getElementById('custom-duration').value);
        const customPrice = parseFloat(document.getElementById('custom-price').value) || 0;
        
        if (!customDuration || customDuration <= 0) {
          msgEl.textContent = '⚠️ Please enter a valid duration for custom plan';
          msgEl.className = 'text-sm text-red-600';
          msgEl.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Add Member';
          return;
        }

        try {
          // استخدام الدالة الجديدة create_custom_membership (بتتجاوز RLS)
          const { data: newMembershipId, error: createError } = await sb.rpc('create_custom_membership', {
            p_gym_id: gymId,
            p_name: `مخصص - ${customDuration} شهر`,
            p_description: `خطة مخصصة لمدة ${customDuration} شهر`,
            p_price: customPrice || (customDuration * 50),
            p_duration: customDuration,
            p_perks: ['خطة مخصصة']
          });
          
          if (createError) {
            console.error('Create custom membership error:', createError);
            throw new Error(createError.message);
          }
          
          membershipId = newMembershipId;
          
          // إعادة تحميل الخطط عشان تظهر في القائمة
          await loadMemberships();
          
        } catch (err) {
          msgEl.textContent = '❌ Error creating custom plan: ' + err.message;
          msgEl.className = 'text-sm text-red-600';
          msgEl.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Add Member';
          return;
        }
      } else if (membershipValue) {
        membershipId = membershipValue;
      }

      // ==========================================================
      // إنشاء حساب المستخدم وإكمال التسجيل
      // ==========================================================
      try {
        // حفظ جلسة المدير
        const { data: sessionData } = await sb.auth.getSession();
        const adminSession = sessionData?.session;

        // إنشاء مستخدم في auth
        const tempEmail = email || `${fullName.replace(/\s/g,'')}_${Date.now()}@temp.com`;
        const { data: authData, error: authError } = await sb.auth.signUp({
          email: tempEmail,
          password: password,
          options: { data: { full_name: fullName } }
        });

        if (authError) throw authError;

        if (!authData?.user) {
          throw new Error('Failed to create user');
        }

        // استعادة جلسة المدير
        if (adminSession) {
          await sb.auth.setSession({
            access_token: adminSession.access_token,
            refresh_token: adminSession.refresh_token
          });
        }

        // استخدام دالة finish_member_setup لإكمال التسجيل
        const { error: setupError } = await sb.rpc('finish_member_setup', {
          p_member_id: authData.user.id,
          p_gym_id: gymId,
          p_full_name: fullName,
          p_phone: phone,
          p_membership_id: membershipId
        });

        if (setupError) {
          console.error('Setup error:', setupError);
          throw new Error(setupError.message || 'Failed to complete member setup');
        }

        msgEl.textContent = '✅ Member added successfully!';
        msgEl.className = 'text-sm text-green-600';
        msgEl.classList.remove('hidden');
        
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Member';
        
        document.getElementById('add-member-form').reset();
        document.getElementById('plan-details').classList.add('hidden');
        document.getElementById('custom-duration-section').classList.add('hidden');
        
        setTimeout(() => {
          document.getElementById('add-member-modal').classList.add('hidden');
          msgEl.classList.add('hidden');
          fetchMembers();
        }, 1500);

      } catch (err) {
        console.error('Add member error:', err);
        msgEl.textContent = '❌ Error: ' + err.message;
        msgEl.className = 'text-sm text-red-600';
        msgEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Member';
      }
    }

    async function fetchMembers() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');

      const { data, error } = await sb
        .from('users')
        .select(`
          *,
          subscription:subscriptions(
            *,
            membership:memberships(*)
          ),
          member_qr_codes:member_qr_codes(qr_code, is_active)
        `)
        .eq('gym_id', gymId)
        .eq('role', 'member')
        .order('created_at', { ascending: false });

      if (error) console.error('Error fetching members:', error);
      allMembers = data || [];

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      renderMembers(document.getElementById('search-input').value);
      setTimeout(updatePageLanguage, 50);
    }

    function renderMembers(searchTerm) {
      const term = (searchTerm || '').toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;
      
      const filtered = allMembers.filter((m) => {
        const matchSearch = 
          m.full_name?.toLowerCase().includes(term) ||
          m.email?.toLowerCase().includes(term) ||
          m.phone?.toLowerCase().includes(term);
        
        const sub = Array.isArray(m.subscription) ? m.subscription[0] : m.subscription;
        let matchStatus = true;
        if (statusFilter === 'active') {
          matchStatus = sub?.status === 'active';
        } else if (statusFilter === 'inactive') {
          matchStatus = sub?.status === 'inactive' || !sub;
        } else if (statusFilter === 'expired') {
          matchStatus = sub?.status === 'expired';
        }
        
        return matchSearch && matchStatus;
      });

      const lang = localStorage.getItem('gym_lang') || 'en';
      const noResultsText = lang === 'ar' ? 'لم يتم العثور على أعضاء' : 'No members found';
      const unknownText = lang === 'ar' ? 'عضو غير معروف' : 'Unknown Member';
      const noEmailText = lang === 'ar' ? 'لا يوجد بريد إلكتروني' : 'No email';
      const activeText = lang === 'ar' ? 'نشط' : 'Active';
      const inactiveText = lang === 'ar' ? 'غير نشط' : 'Inactive';
      const expiredText = lang === 'ar' ? 'منتهي' : 'Expired';
      const expiresText = lang === 'ar' ? 'ينتهي' : 'Expires';
      const showingText = lang === 'ar' ? 'عرض {count} من {total} عضو' : 'Showing {count} of {total} members';

      const el = document.getElementById('members-list');
      if (filtered.length === 0) {
        el.innerHTML = `<div class="text-center py-8 text-gray-500"><p>${noResultsText}</p></div>`;
      } else {
        el.innerHTML = filtered
          .map((m) => {
            const sub = Array.isArray(m.subscription) ? m.subscription[0] : m.subscription;
            const isActive = sub?.status === 'active';
            const isExpired = sub?.status === 'expired';
            
            let statusText = inactiveText;
            let statusClass = 'bg-gray-100 text-gray-600';
            if (isActive) {
              statusText = activeText;
              statusClass = 'bg-green-100 text-green-800';
            } else if (isExpired) {
              statusText = expiredText;
              statusClass = 'bg-red-100 text-red-800';
            }
            
            const qr = Array.isArray(m.member_qr_codes) ? m.member_qr_codes[0] : m.member_qr_codes;
            
            let durationText = '';
            if (sub?.membership) {
              const months = sub.membership.duration_months;
              durationText = months === 1 ? 'شهر' : 
                            months === 0.5 ? 'نصف شهر' :
                            months === 3 ? 'ربع سنوي' :
                            months === 6 ? 'نصف سنوي' :
                            months === 12 ? 'سنوي' :
                            `${months} شهور`;
            }
            
            return `
            <div class="flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 transition-colors">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-xl font-bold text-blue-600">
                  ${getInitials(m.full_name)}
                </div>
                <div>
                  <p class="font-medium text-gray-900">${m.full_name || unknownText}</p>
                  <div class="flex items-center gap-3 text-sm text-gray-500 flex-wrap">
                    <span>${m.email || noEmailText}</span>
                    ${m.phone ? `<span>📱 ${m.phone}</span>` : ''}
                  </div>
                  <div class="flex items-center gap-2 mt-1 flex-wrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusClass}">${statusText}</span>
                    ${sub ? `<span class="text-xs text-gray-500">${sub.membership?.name || ''}</span>` : ''}
                    ${sub ? `<span class="text-xs text-gray-400">${durationText}</span>` : ''}
                    ${sub ? `<span class="text-xs text-gray-400">${expiresText} ${formatDate(sub.end_date)}</span>` : ''}
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                ${qr ? `<button onclick="showMemberQR('${m.id}')" class="text-xs bg-purple-100 text-purple-700 px-3 py-1 rounded-full hover:bg-purple-200 transition-colors" title="QR Code">📱</button>` : ''}
                <button onclick="showMemberDetails('${m.id}')" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full hover:bg-blue-200 transition-colors">👁️</button>
                <button onclick="deleteMember('${m.id}')" class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded-full hover:bg-red-200 transition-colors">🗑️</button>
              </div>
            </div>`;
          })
          .join('');
      }

      document.getElementById('count-label').textContent = showingText.replace('{count}', filtered.length).replace('{total}', allMembers.length);
    }

    // ---------- Member Details ----------
    async function showMemberDetails(memberId) {
      const member = allMembers.find(m => m.id === memberId);
      if (!member) return;

      const sub = Array.isArray(member.subscription) ? member.subscription[0] : member.subscription;
      const qr = Array.isArray(member.member_qr_codes) ? member.member_qr_codes[0] : member.member_qr_codes;

      const { data: attendance } = await sb
        .from('attendance_logs')
        .select('*')
        .eq('user_id', memberId)
        .eq('gym_id', gymId)
        .order('check_in_time', { ascending: false })
        .limit(10);

      const { data: balance } = await sb.rpc('get_loyalty_balance', {
        p_member_id: memberId,
        p_gym_id: gymId
      });

      const lang = localStorage.getItem('gym_lang') || 'en';
      const unknownText = lang === 'ar' ? 'عضو غير معروف' : 'Unknown Member';
      const noEmailText = lang === 'ar' ? 'لا يوجد بريد إلكتروني' : 'No email';
      const planText = lang === 'ar' ? 'الخطة' : 'Plan';
      const statusText = lang === 'ar' ? 'الحالة' : 'Status';
      const pointsText = lang === 'ar' ? 'نقاط الولاء' : 'Points';
      const qrText = lang === 'ar' ? 'رمز QR' : 'QR Code';
      const subscriptionText = lang === 'ar' ? 'تفاصيل الاشتراك' : 'Subscription Details';
      const recentCheckinsText = lang === 'ar' ? 'آخر تسجيلات الحضور' : 'Recent Check-ins';
      const noCheckinsText = lang === 'ar' ? 'لا توجد تسجيلات حضور' : 'No check-ins yet';

      let durationText = '';
      if (sub?.membership) {
        const months = sub.membership.duration_months;
        durationText = months === 1 ? 'شهر' : 
                      months === 0.5 ? 'نصف شهر' :
                      months === 3 ? 'ربع سنوي' :
                      months === 6 ? 'نصف سنوي' :
                      months === 12 ? 'سنوي' :
                      `${months} شهور`;
      }

      const content = document.getElementById('member-details-content');
      content.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-lg">
            <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center text-2xl font-bold text-blue-600">
              ${getInitials(member.full_name)}
            </div>
            <div>
              <h3 class="text-lg font-semibold text-gray-800">${member.full_name || unknownText}</h3>
              <p class="text-sm text-gray-500">${member.email || noEmailText}</p>
              ${member.phone ? `<p class="text-sm text-gray-500">📱 ${member.phone}</p>` : ''}
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-blue-50 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-blue-600">${sub?.membership?.name || 'None'}</p>
              <p class="text-xs text-gray-500">${planText}</p>
            </div>
            <div class="bg-green-50 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-green-600">${sub?.status || 'None'}</p>
              <p class="text-xs text-gray-500">${statusText}</p>
            </div>
            <div class="bg-yellow-50 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-yellow-600">${balance || 0}</p>
              <p class="text-xs text-gray-500">${pointsText}</p>
            </div>
            <div class="bg-purple-50 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-purple-600">${qr ? '✅' : '❌'}</p>
              <p class="text-xs text-gray-500">${qrText}</p>
            </div>
          </div>

          ${sub ? `
            <div class="border-t pt-4">
              <h4 class="font-semibold text-gray-700 mb-2">${subscriptionText}</h4>
              <div class="grid grid-cols-2 gap-2 text-sm">
                <p><span class="text-gray-500">Plan:</span> ${sub.membership?.name || 'N/A'}</p>
                <p><span class="text-gray-500">Duration:</span> ${durationText}</p>
                <p><span class="text-gray-500">Price:</span> $${sub.membership?.price || 0}</p>
                <p><span class="text-gray-500">Status:</span> ${sub.status}</p>
                <p><span class="text-gray-500">Start:</span> ${formatDate(sub.start_date)}</p>
                <p><span class="text-gray-500">End:</span> ${formatDate(sub.end_date)}</p>
                <p><span class="text-gray-500">Auto Renew:</span> ${sub.auto_renew ? '✅' : '❌'}</p>
                ${sub.membership?.perks ? `<p class="col-span-2"><span class="text-gray-500">Perks:</span> ${sub.membership.perks.join(', ')}</p>` : ''}
              </div>
            </div>
          ` : ''}

          ${attendance && attendance.length > 0 ? `
            <div class="border-t pt-4">
              <h4 class="font-semibold text-gray-700 mb-2">${recentCheckinsText}</h4>
              <div class="space-y-1">
                ${attendance.slice(0, 5).map(a => `
                  <div class="flex items-center justify-between text-sm p-2 bg-gray-50 rounded">
                    <span>${formatDateTime(a.check_in_time)}</span>
                    <span class="text-xs text-gray-500">${a.method === 'qr_code' ? '📱 QR' : '✏️ Manual'}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : `
            <div class="border-t pt-4">
              <p class="text-sm text-gray-500 text-center">${noCheckinsText}</p>
            </div>
          `}

          ${qr ? `
            <div class="border-t pt-4">
              <h4 class="font-semibold text-gray-700 mb-2">QR Code</h4>
              <div class="flex items-center gap-4">
                <div id="detail-qr-canvas" class="bg-white p-2 rounded border"></div>
                <div>
                  <p class="text-xs font-mono text-gray-500 break-all">${qr.qr_code}</p>
                  <button onclick="showMemberQR('${member.id}')" class="mt-2 text-sm bg-purple-600 hover:bg-purple-700 text-white px-4 py-1 rounded-lg">
                    View Full QR
                  </button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      if (qr && typeof QRCode !== 'undefined') {
        const container = document.getElementById('detail-qr-canvas');
        if (container) {
          container.innerHTML = '';
          new QRCode(container, {
            text: qr.qr_code,
            width: 100,
            height: 100
          });
        }
      }

      document.getElementById('member-details-modal').classList.remove('hidden');
    }

    // ---------- Member QR ----------
    async function showMemberQR(memberId) {
      const member = allMembers.find(m => m.id === memberId);
      if (!member) return;

      const qr = Array.isArray(member.member_qr_codes) ? member.member_qr_codes[0] : member.member_qr_codes;
      if (!qr) {
        try {
          await sb.rpc('ensure_member_qr', {
            p_member_id: memberId,
            p_gym_id: gymId
          });
          await fetchMembers();
          const updatedMember = allMembers.find(m => m.id === memberId);
          const newQr = Array.isArray(updatedMember?.member_qr_codes) ? updatedMember.member_qr_codes[0] : null;
          if (newQr) {
            displayQR(member, newQr.qr_code);
          }
        } catch (err) {
          alert('Error generating QR: ' + err.message);
        }
      } else {
        displayQR(member, qr.qr_code);
      }
    }

    function displayQR(member, qrCode) {
      document.getElementById('qr-member-name').textContent = member.full_name || 'Member';
      document.getElementById('qr-member-email').textContent = member.email || '';
      document.getElementById('qr-code-text').textContent = qrCode;
      currentQrMemberId = member.id;

      const container = document.getElementById('member-qr-canvas');
      container.innerHTML = '';
      
      if (typeof QRCode !== 'undefined') {
        new QRCode(container, {
          text: qrCode,
          width: 200,
          height: 200
        });
      }

      document.getElementById('member-qr-modal').classList.remove('hidden');
    }

    function downloadMemberQR() {
      const canvas = document.querySelector('#member-qr-canvas canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.download = `member-${currentQrMemberId}-qr.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    }

    // ---------- Delete Member ----------
    async function deleteMember(memberId) {
      const member = allMembers.find(m => m.id === memberId);
      const lang = localStorage.getItem('gym_lang') || 'en';
      const confirmText = lang === 'ar' 
        ? `هل أنت متأكد من حذف ${member?.full_name || 'هذا العضو'}؟ لا يمكن التراجع عن هذا الإجراء.`
        : `Are you sure you want to delete ${member?.full_name || 'this member'}? This action cannot be undone.`;
      
      if (!confirm(confirmText)) return;
      
      const { error } = await sb
        .from('users')
        .delete()
        .eq('id', memberId)
        .eq('gym_id', gymId);
      
      if (error) {
        alert('Error deleting member: ' + error.message);
        return;
      }
      
      await fetchMembers();
    }

    // Make functions globally available
    window.showMemberDetails = showMemberDetails;
    window.showMemberQR = showMemberQR;
    window.deleteMember = deleteMember;
    window.downloadMemberQR = downloadMemberQR;

    // Run init
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
