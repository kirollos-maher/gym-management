<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loyalty - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app-nav"></div>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading-state" class="flex items-center justify-center h-96">
      <div class="spinner h-12 w-12"></div>
    </div>
    <div id="content" class="hidden space-y-6"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    let gymId, userId, role;

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      renderNav(auth.user, 'loyalty');
      gymId = auth.profile?.gym_id;
      userId = auth.user.id;
      role = auth.profile?.role;

      document.getElementById('loading-state').classList.add('hidden');
      const content = document.getElementById('content');
      content.classList.remove('hidden');

      if (role === 'gym_owner' || role === 'super_admin') {
        content.innerHTML = `
          <div>
            <h1 class="text-2xl font-bold text-gray-800">Loyalty Program</h1>
            <p class="text-sm text-gray-500">Manage loyalty points settings and view member activity</p>
          </div>
          <div id="settings-panel" class="bg-white rounded-lg shadow-md p-6"></div>
        `;
        await renderSettingsPanel();
      } else if (role === 'member') {
        content.innerHTML = `
          <div>
            <h1 class="text-2xl font-bold text-gray-800">My Loyalty Points</h1>
            <p class="text-sm text-gray-500">Track your points and redeem rewards</p>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="space-y-6">
              <div id="balance-card"></div>
              <div id="redeem-card" class="bg-white rounded-lg shadow-md p-6"></div>
            </div>
            <div id="history-card"></div>
          </div>
        `;
        await renderMemberView();
      } else {
        content.innerHTML = '<div class="text-center py-12 text-gray-500">You don\'t have access to loyalty features</div>';
      }
    }

    async function getMemberBalance(memberId) {
      const { data } = await sb
        .from('loyalty_transactions')
        .select('points, transaction_type')
        .eq('member_id', memberId)
        .eq('gym_id', gymId);

      return (data || []).reduce(
        (bal, t) => (t.transaction_type === 'earned' ? bal + t.points : bal - t.points),
        0
      );
    }

    async function getMemberHistory(memberId, limit = 50) {
      const { data } = await sb
        .from('loyalty_transactions')
        .select('*')
        .eq('member_id', memberId)
        .eq('gym_id', gymId)
        .order('created_at', { ascending: false })
        .limit(limit);
      return data || [];
    }

    function historyHtml(transactions) {
      if (!transactions.length) {
        return `<div class="bg-white rounded-lg shadow-md p-6 text-center text-gray-500">
          <p>No loyalty transactions yet</p>
        </div>`;
      }
      const labels = { attendance: 'Check-in', renewal: 'Renewal', canteen: 'Canteen', manual: 'Manual' };
      return `
        <div class="bg-white rounded-lg shadow-md p-6">
          <h3 class="text-lg font-semibold text-gray-900 mb-1">Transaction History</h3>
          <p class="text-sm text-gray-500 mb-4">Recent loyalty point activity</p>
          <div class="space-y-3">
            ${transactions
              .map((t) => {
                const earned = t.transaction_type === 'earned';
                return `
              <div class="flex items-center justify-between p-3 rounded-lg border border-gray-100 hover:bg-gray-50 transition-colors">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center ${earned ? 'bg-green-100' : 'bg-red-100'}">
                    ${earned ? '⬆️' : '⬇️'}
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="font-medium text-gray-900">${labels[t.source] || t.source}</span>
                      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                        earned ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                      }">${earned ? 'Earned' : 'Redeemed'}</span>
                    </div>
                    <div class="text-xs text-gray-500">${formatDateTime(t.created_at)}</div>
                    ${t.description ? `<p class="text-xs text-gray-400 mt-1">${t.description}</p>` : ''}
                  </div>
                </div>
                <div class="text-lg font-bold ${earned ? 'text-green-600' : 'text-red-600'}">
                  ${earned ? '+' : '-'}${t.points}
                </div>
              </div>`;
              })
              .join('')}
          </div>
        </div>`;
    }

    async function renderMemberView() {
      const [balance, history] = await Promise.all([getMemberBalance(userId), getMemberHistory(userId)]);

      document.getElementById('balance-card').innerHTML = `
        <div class="bg-gradient-to-br from-yellow-50 to-orange-50 border border-yellow-200 rounded-lg shadow-md p-6">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-sm font-medium text-yellow-800">Loyalty Points</p>
              <p class="text-4xl font-bold text-yellow-900 mt-1">${balance.toLocaleString()}</p>
              <p class="text-xs text-yellow-700 mt-3">⭐ Earn points with check-ins</p>
            </div>
            <div class="p-3 bg-yellow-200 rounded-full text-3xl">⭐</div>
          </div>
        </div>`;

      document.getElementById('redeem-card').innerHTML = `
        <h3 class="text-lg font-semibold text-gray-900 mb-3">Redeem Points</h3>
        <div class="flex gap-2">
          <input type="number" min="1" id="redeem-amount" placeholder="Points to redeem"
            class="flex-1 rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button id="redeem-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2">Redeem</button>
        </div>
        <p id="redeem-msg" class="text-sm mt-2"></p>
      `;

      document.getElementById('history-card').innerHTML = historyHtml(history);

      document.getElementById('redeem-btn').addEventListener('click', async () => {
        const amount = Number(document.getElementById('redeem-amount').value);
        const msgEl = document.getElementById('redeem-msg');
        if (!amount || amount <= 0) {
          msgEl.textContent = 'Enter a valid amount';
          msgEl.className = 'text-sm mt-2 text-red-600';
          return;
        }
        const currentBalance = await getMemberBalance(userId);
        if (currentBalance < amount) {
          msgEl.textContent = `Insufficient points. Available: ${currentBalance}`;
          msgEl.className = 'text-sm mt-2 text-red-600';
          return;
        }
        const { error } = await sb.from('loyalty_transactions').insert({
          member_id: userId,
          gym_id: gymId,
          points: amount,
          transaction_type: 'redeemed',
          source: 'manual',
          description: `Redeemed ${amount} points`
        });
        if (error) {
          msgEl.textContent = 'Failed to redeem points';
          msgEl.className = 'text-sm mt-2 text-red-600';
          return;
        }
        msgEl.textContent = 'Points redeemed successfully!';
        msgEl.className = 'text-sm mt-2 text-green-600';
        await renderMemberView();
      });
    }

    async function renderSettingsPanel() {
      const { data: settings } = await sb.from('loyalty_settings').select('*').eq('gym_id', gymId).single();

      const values = settings || {
        points_per_checkin: 0,
        points_per_renewal_currency: 0,
        points_per_canteen_purchase: 0,
        points_redemption_rate: 0
      };

      document.getElementById('settings-panel').innerHTML = `
        <h3 class="text-lg font-semibold text-gray-900 mb-1">Loyalty Points Settings</h3>
        <p class="text-sm text-gray-500 mb-4">Configure how members earn and redeem loyalty points</p>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Points per Check-in</label>
            <input type="number" min="0" id="s-checkin" value="${values.points_per_checkin}"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Points per Currency Unit on Renewal</label>
            <input type="number" min="0" step="0.01" id="s-renewal" value="${values.points_per_renewal_currency}"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Points per Currency Unit on Canteen Purchase</label>
            <input type="number" min="0" step="0.01" id="s-canteen" value="${values.points_per_canteen_purchase}"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Points Redemption Rate</label>
            <input type="number" min="0" step="0.01" id="s-redemption" value="${values.points_redemption_rate}"
              class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div class="pt-4 border-t flex items-center gap-3">
            <button id="save-settings-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2">Save Settings</button>
            <span id="save-msg" class="text-sm"></span>
          </div>
        </div>
      `;

      document.getElementById('save-settings-btn').addEventListener('click', async () => {
        const msgEl = document.getElementById('save-msg');
        const payload = {
          gym_id: gymId,
          points_per_checkin: Number(document.getElementById('s-checkin').value) || 0,
          points_per_renewal_currency: Number(document.getElementById('s-renewal').value) || 0,
          points_per_canteen_purchase: Number(document.getElementById('s-canteen').value) || 0,
          points_redemption_rate: Number(document.getElementById('s-redemption').value) || 0,
          updated_at: new Date().toISOString()
        };
        const { error } = await sb.from('loyalty_settings').upsert(payload, { onConflict: 'gym_id' });
        msgEl.textContent = error ? 'Failed to save settings' : 'Settings saved successfully!';
        msgEl.className = `text-sm ${error ? 'text-red-600' : 'text-green-600'}`;
      });
    }

    init();
  </script>
</body>
</html>
