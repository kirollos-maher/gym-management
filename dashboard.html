<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
  // تطبيق Dark Mode فوراً عند تحميل الصفحة
  (function() {
    const isDark = localStorage.getItem('gym_theme') === 'dark';
    if (isDark) {
      document.body.classList.add('dark-mode');
    }
  })();
  </script>

  <div id="app-nav"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading-state" class="flex items-center justify-center h-96">
      <div class="spinner h-12 w-12"></div>
    </div>

    <div id="dashboard-content" class="hidden space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-800 dark:text-white" data-i18n="dashboard.title">Dashboard</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400" data-i18n="dashboard.welcome">Welcome back! Here's what's happening with your gym today.</p>
        </div>
        <button id="refresh-btn" class="text-sm text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 flex items-center gap-1">
          <span>🔄</span> <span data-i18n="dashboard.refresh">Refresh</span>
        </button>
      </div>

      <div id="stats-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden col-span-1">
          <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700"><h3 class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="dashboard.revenue.overview">Revenue Overview</h3></div>
          <div class="px-6 py-4"><div class="w-full h-[300px]"><canvas id="revenue-chart"></canvas></div></div>
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden col-span-1">
          <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700"><h3 class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="dashboard.attendance.activity">Check-in Activity</h3></div>
          <div class="px-6 py-4"><div class="w-full h-[300px]"><canvas id="attendance-chart"></canvas></div></div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
          <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700"><h3 class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="dashboard.member.distribution">Member Distribution</h3></div>
          <div class="px-6 py-4">
            <div class="w-full h-[300px]"><canvas id="distribution-chart"></canvas></div>
            <div id="distribution-legend" class="flex flex-wrap gap-3 mt-4 justify-center"></div>
          </div>
        </div>
        <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
          <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="dashboard.upcoming.renewals">Upcoming Renewals</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400" data-i18n="dashboard.renewals.desc">Members expiring in the next 7 days</p>
          </div>
          <div class="px-6 py-4"><div id="renewals-list" class="space-y-3"></div></div>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700"><h3 class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="dashboard.recent.activity">Recent Activity</h3></div>
        <div class="px-6 py-4"><div id="activity-list" class="space-y-4"></div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/language.js"></script>
  <script>
    let gymId = null;
    let currencySymbol = '$';

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      
      renderNav(auth.user, 'dashboard');
      gymId = auth.profile?.gym_id;
      
      currencySymbol = getCurrencySymbol(await getGymCurrency());
      
      if (!gymId) {
        document.getElementById('loading-state').innerHTML =
          `<p class="text-gray-500 dark:text-gray-400" data-i18n="dashboard.nogym">No gym linked to this account yet.</p>`;
        setTimeout(updatePageLanguage, 50);
        return;
      }
      await loadDashboard();
      document.getElementById('refresh-btn').addEventListener('click', loadDashboard);
      
      setTimeout(updatePageLanguage, 100);
    }

    async function loadDashboard() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('dashboard-content').classList.add('hidden');

      const [stats, attendanceData, revenueData, distribution, activity] = await Promise.all([
        getDashboardStats(),
        getAttendanceData(),
        getRevenueData(),
        getMemberDistribution(),
        getRecentActivity()
      ]);

      renderStats(stats);
      drawAttendanceChart(attendanceData);
      drawRevenueChart(revenueData);
      drawDistributionChart(distribution);
      renderRenewals(stats?.expiringMembers || []);
      renderActivity(activity);

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('dashboard-content').classList.remove('hidden');
      setTimeout(updatePageLanguage, 50);
    }

    async function getDashboardStats() {
      const today = new Date().toISOString().split('T')[0];
      const startOfMonth = new Date();
      startOfMonth.setDate(1);
      const startOfMonthStr = startOfMonth.toISOString().split('T')[0];

      const { count: totalMembers } = await sb
        .from('users')
        .select('*', { count: 'exact', head: true })
        .eq('gym_id', gymId)
        .eq('role', 'member');

      const { data: activeSubscriptions } = await sb
        .from('subscriptions')
        .select('member_id')
        .eq('gym_id', gymId)
        .eq('status', 'active')
        .gte('end_date', today);

      const activeMembers = activeSubscriptions?.length || 0;

      const { data: todayCheckIns } = await sb
        .from('attendance_logs')
        .select('*')
        .eq('gym_id', gymId)
        .eq('type', 'member')
        .gte('check_in_time', today);

      const todayCheckInsCount = todayCheckIns?.length || 0;

      const { data: monthlySubscriptions } = await sb
        .from('subscriptions')
        .select('membership:memberships(price)')
        .eq('gym_id', gymId)
        .eq('status', 'active')
        .gte('start_date', startOfMonthStr);

      const monthlyRevenue =
        monthlySubscriptions?.reduce((total, sub) => total + (sub.membership?.price || 0), 0) || 0;

      const sevenDaysLater = new Date();
      sevenDaysLater.setDate(sevenDaysLater.getDate() + 7);
      const sevenDaysLaterStr = sevenDaysLater.toISOString().split('T')[0];

      const { data: expiringSubscriptions } = await sb
        .from('subscriptions')
        .select('*, user:users(full_name, email)')
        .eq('gym_id', gymId)
        .eq('status', 'active')
        .lte('end_date', sevenDaysLaterStr)
        .gte('end_date', today);

      return {
        totalMembers: totalMembers || 0,
        activeMembers,
        todayCheckIns: todayCheckInsCount,
        monthlyRevenue,
        expiringMembers: expiringSubscriptions || [],
        checkInRate: totalMembers ? Math.round((todayCheckInsCount / totalMembers) * 100) : 0
      };
    }

    async function getAttendanceData(days = 30) {
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - days);
      const startDateStr = startDate.toISOString().split('T')[0];

      const { data } = await sb
        .from('attendance_logs')
        .select('check_in_time')
        .eq('gym_id', gymId)
        .eq('type', 'member')
        .gte('check_in_time', startDateStr);

      const dateMap = new Map();
      for (let i = 0; i < days; i++) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        dateMap.set(date.toISOString().split('T')[0], 0);
      }

      (data || []).forEach((log) => {
        const date = log.check_in_time.split('T')[0];
        if (dateMap.has(date)) dateMap.set(date, dateMap.get(date) + 1);
      });

      return Array.from(dateMap.entries())
        .map(([date, count]) => ({ date, count }))
        .sort((a, b) => a.date.localeCompare(b.date));
    }

    async function getRevenueData(days = 30) {
      const startDate = new Date();
      startDate.setDate(startDate.getDate() - days);
      const startDateStr = startDate.toISOString().split('T')[0];

      const { data } = await sb
        .from('subscriptions')
        .select('start_date, membership:memberships(price)')
        .eq('gym_id', gymId)
        .eq('status', 'active')
        .gte('start_date', startDateStr);

      const dateMap = new Map();
      for (let i = 0; i < days; i++) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        dateMap.set(date.toISOString().split('T')[0], 0);
      }

      (data || []).forEach((sub) => {
        if (dateMap.has(sub.start_date)) {
          dateMap.set(sub.start_date, dateMap.get(sub.start_date) + (sub.membership?.price || 0));
        }
      });

      return Array.from(dateMap.entries())
        .map(([date, revenue]) => ({ date, revenue }))
        .sort((a, b) => a.date.localeCompare(b.date));
    }

    async function getMemberDistribution() {
      const { data } = await sb
        .from('subscriptions')
        .select('membership:memberships(name)')
        .eq('gym_id', gymId)
        .eq('status', 'active');

      const distribution = new Map();
      (data || []).forEach((sub) => {
        const name = sub.membership?.name || 'Unknown';
        distribution.set(name, (distribution.get(name) || 0) + 1);
      });

      return Array.from(distribution.entries()).map(([name, count]) => ({ name, count }));
    }

    async function getRecentActivity(limit = 10) {
      const { data } = await sb
        .from('attendance_logs')
        .select('*, user:users(full_name, email)')
        .eq('gym_id', gymId)
        .order('check_in_time', { ascending: false })
        .limit(limit);

      return data || [];
    }

    function renderStats(stats) {
      const lang = localStorage.getItem('gym_lang') || 'en';
      const titles = {
        'total.members': lang === 'ar' ? 'إجمالي الأعضاء' : 'Total Members',
        'active.members': lang === 'ar' ? 'الأعضاء النشطون' : 'Active Members',
        'today.checkins': lang === 'ar' ? 'تسجيلات اليوم' : "Today's Check-Ins",
        'monthly.revenue': lang === 'ar' ? 'الإيرادات الشهرية' : 'Monthly Revenue',
        'of.total': lang === 'ar' ? 'من الإجمالي' : 'of total'
      };

      const cards = [
        { title: titles['total.members'], value: stats.totalMembers, icon: '👥', color: 'text-blue-600 dark:text-blue-400' },
        { title: titles['active.members'], value: stats.activeMembers, icon: '✅', color: 'text-green-600 dark:text-green-400' },
        {
          title: titles['today.checkins'],
          value: stats.todayCheckIns,
          icon: '📅',
          color: 'text-purple-600 dark:text-purple-400',
          subtitle: `${stats.checkInRate}% ${titles['of.total']}`
        },
        { title: titles['monthly.revenue'], value: `${currencySymbol}${stats.monthlyRevenue.toLocaleString()}`, icon: '💰', color: 'text-yellow-600 dark:text-yellow-400' }
      ];

      document.getElementById('stats-cards').innerHTML = cards
        .map(
          (c) => `
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow">
          <div class="p-6 flex items-start justify-between">
            <div>
              <p class="text-sm font-medium text-gray-500 dark:text-gray-400">${c.title}</p>
              <p class="text-2xl font-bold text-gray-900 dark:text-white mt-2">${c.value}</p>
              ${c.subtitle ? `<p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${c.subtitle}</p>` : ''}
            </div>
            <div class="p-3 rounded-full bg-gray-50 dark:bg-gray-700 text-2xl ${c.color}">${c.icon}</div>
          </div>
        </div>
      `
        )
        .join('');
    }

    function renderRenewals(subs) {
      const el = document.getElementById('renewals-list');
      const lang = localStorage.getItem('gym_lang') || 'en';
      const noRenewals = lang === 'ar' ? 'لا توجد تجديدات قادمة' : 'No upcoming renewals';
      const daysRemainingText = lang === 'ar' ? 'يوم متبقي' : 'days remaining';
      const urgentText = lang === 'ar' ? 'عاجل' : 'Urgent';
      const unknownText = lang === 'ar' ? 'عضو غير معروف' : 'Unknown Member';
      const noEmailText = lang === 'ar' ? 'لا يوجد بريد إلكتروني' : 'No email';

      if (!subs.length) {
        el.innerHTML = `<div class="text-center py-8 text-gray-500 dark:text-gray-400"><p>${noRenewals}</p></div>`;
        return;
      }
      el.innerHTML = subs
        .map((sub) => {
          const daysRemaining = daysBetween(new Date(), sub.end_date);
          const isUrgent = daysRemaining <= 2;
          return `
          <div class="flex items-center justify-between p-3 rounded-lg border border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
            <div class="flex items-center space-x-3 space-x-reverse">
              <div class="w-10 h-10 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center">👤</div>
              <div>
                <p class="font-medium text-gray-900 dark:text-white">${sub.user?.full_name || unknownText}</p>
                <p class="text-xs text-gray-500 dark:text-gray-400">${sub.user?.email || noEmailText}</p>
              </div>
            </div>
            <div class="text-left">
              <div class="text-sm text-gray-600 dark:text-gray-300">${formatDate(sub.end_date)}</div>
              <div class="flex items-center justify-end gap-2 mt-1">
                <span class="text-xs text-gray-500 dark:text-gray-400">${daysRemaining} ${daysRemainingText}</span>
                ${
                  isUrgent
                    ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-400 animate-pulse">${urgentText}</span>`
                    : ''
                }
              </div>
            </div>
          </div>`;
        })
        .join('');
    }

    function renderActivity(activities) {
      const el = document.getElementById('activity-list');
      const lang = localStorage.getItem('gym_lang') || 'en';
      const noActivity = lang === 'ar' ? 'لا يوجد نشاط حديث' : 'No recent activity';
      const unknownText = lang === 'ar' ? 'عضو غير معروف' : 'Unknown Member';
      const noEmailText = lang === 'ar' ? 'لا يوجد بريد إلكتروني' : 'No email';
      const checkedInText = lang === 'ar' ? 'تم تسجيل الحضور' : 'Checked In';

      if (!activities.length) {
        el.innerHTML = `<div class="text-center py-8 text-gray-500 dark:text-gray-400"><p>${noActivity}</p></div>`;
        return;
      }
      el.innerHTML = activities
        .map(
          (a) => `
        <div class="flex items-start space-x-3 space-x-reverse p-3 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
          <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center flex-shrink-0">👤</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 dark:text-white">${a.user?.full_name || unknownText}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">${a.user?.email || noEmailText}</p>
            <div class="flex items-center gap-3 mt-1">
              <span class="text-xs text-gray-500 dark:text-gray-400">${formatDateTime(a.check_in_time)}</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-400">${checkedInText}</span>
            </div>
          </div>
          <div class="text-xs text-gray-400 dark:text-gray-500">${a.method === 'qr_code' ? '📱 QR' : '✏️ Manual'}</div>
        </div>`
        )
        .join('');
    }

    function setupCanvas(canvas) {
      const rect = canvas.parentElement.getBoundingClientRect();
      const width = rect.width || 400;
      const height = 300;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      const ctx = canvas.getContext('2d');
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      return { ctx, width, height };
    }

    function drawAttendanceChart(data) {
      const canvas = document.getElementById('attendance-chart');
      if (!data.length) return;
      const { ctx, width, height } = setupCanvas(canvas);
      const padding = { top: 40, bottom: 40, left: 50, right: 20 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const maxCount = Math.max(...data.map((d) => d.count), 10);

      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#e5e7eb';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartHeight / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        const value = Math.round(maxCount - (maxCount / 4) * i);
        ctx.fillStyle = '#6b7280';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(value.toString(), padding.left - 10, y + 4);
      }

      ctx.beginPath();
      data.forEach((item, index) => {
        const x = padding.left + (index / (data.length - 1 || 1)) * chartWidth;
        const y = padding.top + chartHeight - (item.count / maxCount) * chartHeight;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = '#8b5cf6';
      ctx.lineWidth = 3;
      ctx.stroke();

      data.forEach((item, index) => {
        const x = padding.left + (index / (data.length - 1 || 1)) * chartWidth;
        const y = padding.top + chartHeight - (item.count / maxCount) * chartHeight;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#8b5cf6';
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      data.forEach((item, index) => {
        if (index % 3 === 0 || index === data.length - 1) {
          const x = padding.left + (index / (data.length - 1 || 1)) * chartWidth;
          const label = new Date(item.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          ctx.fillStyle = '#6b7280';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(label, x, padding.top + chartHeight + 20);
        }
      });
    }

    function drawRevenueChart(data) {
      const canvas = document.getElementById('revenue-chart');
      if (!data.length) return;
      const { ctx, width, height } = setupCanvas(canvas);
      const padding = { top: 40, bottom: 40, left: 60, right: 20 };
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;
      const maxRevenue = Math.max(...data.map((d) => d.revenue), 100);

      ctx.clearRect(0, 0, width, height);
      ctx.strokeStyle = '#e5e7eb';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartHeight / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        const value = maxRevenue - (maxRevenue / 4) * i;
        ctx.fillStyle = '#6b7280';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`${currencySymbol}${Math.round(value)}`, padding.left - 10, y + 4);
      }

      const barWidth = Math.min((chartWidth / data.length) * 0.6, 30);
      const gapWidth = chartWidth / data.length;

      data.forEach((item, index) => {
        const x = padding.left + index * gapWidth + (gapWidth - barWidth) / 2;
        const barHeight = (item.revenue / maxRevenue) * chartHeight;
        const y = padding.top + chartHeight - barHeight;
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(x, y, barWidth, barHeight);

        if (index % 3 === 0 || index === data.length - 1) {
          const label = new Date(item.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          ctx.fillStyle = '#6b7280';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(label, x + barWidth / 2, padding.top + chartHeight + 20);
        }
      });
    }

    function drawDistributionChart(data) {
      const canvas = document.getElementById('distribution-chart');
      const legendEl = document.getElementById('distribution-legend');
      const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981'];
      const lang = localStorage.getItem('gym_lang') || 'en';
      const totalText = lang === 'ar' ? 'الإجمالي' : 'Total';

      if (!data.length) {
        legendEl.innerHTML = '';
        return;
      }

      const { ctx, width, height } = setupCanvas(canvas);
      const total = data.reduce((sum, item) => sum + item.count, 0);
      if (total === 0) return;

      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(width, height) / 2 - 40;

      ctx.clearRect(0, 0, width, height);
      let startAngle = -Math.PI / 2;

      data.forEach((item, i) => {
        const sliceAngle = (item.count / total) * Math.PI * 2;
        const endAngle = startAngle + sliceAngle;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
        startAngle = endAngle;
      });

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
      ctx.fillStyle = '#1f2937';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(totalText, centerX, centerY - 12);
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(total.toString(), centerX, centerY + 18);

      legendEl.innerHTML = data
        .map((item, i) => {
          const pct = Math.round((item.count / total) * 100);
          return `
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full" style="background-color:${colors[i % colors.length]}"></div>
            <span class="text-xs text-gray-600 dark:text-gray-400">${item.name} (${pct}%)</span>
          </div>`;
        })
        .join('');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
