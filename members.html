<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members - Gym Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app-nav"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loading-state" class="flex items-center justify-center h-96">
      <div class="spinner h-12 w-12"></div>
    </div>

    <div id="content" class="hidden space-y-6">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 class="text-2xl font-bold text-gray-800 dark:text-white" data-i18n="members.title">Members</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400" data-i18n="members.desc">Manage your gym members and their subscriptions</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button id="add-member-btn" class="bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium px-4 py-2 flex items-center gap-2" data-i18n="members.add">
            ➕ Add Member
          </button>
          <a href="canteen.html" class="bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium px-4 py-2 flex items-center gap-2">
            🛒 Canteen
          </a>
          <button id="refresh-btn" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-300 rounded-lg font-medium px-4 py-2 flex items-center gap-2" data-i18n="members.refresh">
            🔄 Refresh
          </button>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6">
        <div class="flex items-center gap-4 mb-6 flex-wrap">
          <input type="text" id="search-input" placeholder="Search by name, email, or phone..."
            class="flex-1 min-w-[200px] rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <select id="status-filter" class="rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="all" data-i18n="members.all">All Members</option>
            <option value="active" data-i18n="members.active">Active</option>
            <option value="inactive" data-i18n="members.inactive">Inactive</option>
            <option value="expired" data-i18n="members.expired">Expired</option>
          </select>
        </div>

        <div id="members-list" class="space-y-3"></div>

        <div id="count-label" class="mt-4 text-sm text-gray-500 dark:text-gray-400"></div>
      </div>
    </div>
  </main>

  <!-- Modal: Add Member -->
  <div id="add-member-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800 dark:text-white" data-i18n="members.add">➕ Add New Member</h2>
        <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300 text-2xl">&times;</button>
      </div>
      <form id="add-member-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="members.fullname">Full Name *</label>
          <input type="text" id="new-fullname" required class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="members.email">Email</label>
          <input type="email" id="new-email" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="members.phone">Phone</label>
          <input type="tel" id="new-phone" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="auth.password">Password *</label>
          <input type="password" id="new-password" required minlength="6" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" data-i18n="auth.password.min">At least 6 characters</p>
        </div>
        
        <!-- Membership Plan Selection -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" data-i18n="members.plan">Membership Plan</label>
          <select id="new-membership" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="" data-i18n="members.select.plan">-- Select a plan --</option>
          </select>
          <div id="plan-details" class="mt-2 text-sm text-gray-500 dark:text-gray-400 hidden"></div>
        </div>

        <div class="border-t border-gray-200 dark:border-gray-700 pt-4 flex gap-3">
          <button type="button" id="cancel-add-btn" class="flex-1 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white rounded-lg font-medium px-4 py-2" data-i18n="common.cancel">Cancel</button>
          <button type="submit" id="submit-add-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium px-4 py-2" data-i18n="members.add">Add Member</button>
        </div>
        <div id="add-msg" class="text-sm hidden"></div>
      </form>
    </div>
  </div>

  <!-- Modal: Member Details -->
  <div id="member-details-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800 dark:text-white">👤 Member Details</h2>
        <button id="close-details-btn" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300 text-2xl">&times;</button>
      </div>
      <div id="member-details-content"></div>
    </div>
  </div>

  <!-- Modal: Member QR -->
  <div id="member-qr-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md p-6 text-center">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800 dark:text-white">📱 Member QR Code</h2>
        <button id="close-qr-modal" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300 text-2xl">&times;</button>
      </div>
      <div id="member-qr-display" class="flex flex-col items-center p-4">
        <div id="member-qr-canvas"></div>
        <p id="qr-member-name" class="font-semibold text-gray-800 dark:text-white mt-4"></p>
        <p id="qr-member-email" class="text-sm text-gray-500 dark:text-gray-400"></p>
        <p id="qr-code-text" class="text-xs font-mono text-gray-400 dark:text-gray-500 mt-2 break-all"></p>
        <button id="download-qr-btn" class="mt-4 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium px-4 py-2">
          📥 Download QR
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/language.js"></script>
  <script>
    let gymId = null;
    let allMembers = [];
    let memberships = [];
    let currentQrMemberId = null;
    let currencySymbol = '$';

    async function init() {
      const auth = await requireAuth();
      if (!auth) return;
      renderNav(auth.user, 'members');
      gymId = auth.profile?.gym_id;
      
      // جلب العملة
      const currency = await getGymCurrency();
      currencySymbol = getCurrencySymbol(currency);

      await loadMemberships();
      await fetchMembers();
      
      // Event Listeners
      document.getElementById('refresh-btn').addEventListener('click', fetchMembers);
      document.getElementById('search-input').addEventListener('input', (e) => renderMembers(e.target.value));
      document.getElementById('status-filter').addEventListener('change', () => renderMembers(document.getElementById('search-input').value));
      
      // Add Member Modal
      document.getElementById('add-member-btn').addEventListener('click', () => {
        document.getElementById('add-member-modal').classList.remove('hidden');
        populateMembershipSelect();
        document.getElementById('add-msg').classList.add('hidden');
        document.getElementById('add-member-form').reset();
        document.getElementById('plan-details').classList.add('hidden');
      });
      document.getElementById('close-modal-btn').addEventListener('click', () => {
        document.getElementById('add-member-modal').classList.add('hidden');
        document.getElementById('add-msg').classList.add('hidden');
        document.getElementById('add-member-form').reset();
      });
      document.getElementById('cancel-add-btn').addEventListener('click', () => {
        document.getElementById('add-member-modal').classList.add('hidden');
        document.getElementById('add-msg').classList.add('hidden');
        document.getElementById('add-member-form').reset();
      });
      document.getElementById('add-member-form').addEventListener('submit', addMember);
      
      // Membership select change - show details
      document.getElementById('new-membership').addEventListener('change', showPlanDetails);
      
      // Details Modal
      document.getElementById('close-details-btn').addEventListener('click', () => {
        document.getElementById('member-details-modal').classList.add('hidden');
      });
      
      // QR Modal
      document.getElementById('close-qr-modal').addEventListener('click', () => {
        document.getElementById('member-qr-modal').classList.add('hidden');
      });
      document.getElementById('download-qr-btn').addEventListener('click', downloadMemberQR);
      
      setTimeout(updatePageLanguage, 100);
    }

    async function loadMemberships() {
      const { data, error } = await sb
        .from('memberships')
        .select('*')
        .eq('gym_id', gymId)
        .order('duration_months', { ascending: true });
      
      if (error) {
        console.error('Error loading memberships:', error);
        memberships = [];
        return;
      }
      memberships = data || [];
    }

    function populateMembershipSelect() {
      const select = document.getElementById('new-membership');
      select.innerHTML = '<option value="">-- Select a plan --</option>';
      
      memberships.forEach(m => {
        const durationText = m.duration_months === 1 ? 'شهر' : 
                            m.duration_months === 2 ? 'شهرين' :
                            m.duration_months === 3 ? 'ربع سنوي' :
                            m.duration_months === 6 ? 'نصف سنوي' :
                            m.duration_months === 12 ? 'سنوي' :
                            `${m.duration_months} شهور`;
        select.innerHTML += `<option value="${m.id}">${m.name} - ${currencySymbol}${m.price} (${durationText})</option>`;
      });
    }

    function showPlanDetails() {
      const select = document.getElementById('new-membership');
      const detailsEl = document.getElementById('plan-details');
      
      if (select.value) {
        const plan = memberships.find(m => m.id === select.value);
        if (plan) {
          const durationText = plan.duration_months === 1 ? 'شهر' : 
                              plan.duration_months === 2 ? 'شهرين' :
                              plan.duration_months === 3 ? 'ربع سنوي' :
                              plan.duration_months === 6 ? 'نصف سنوي' :
                              plan.duration_months === 12 ? 'سنوي' :
                              `${plan.duration_months} شهور`;
          detailsEl.innerHTML = `
            <div class="bg-blue-50 dark:bg-blue-900/30 p-3 rounded-lg">
              <p><strong>Price:</strong> ${currencySymbol}${plan.price}</p>
              <p><strong>Duration:</strong> ${durationText}</p>
              ${plan.perks ? `<p><strong>Perks:</strong> ${plan.perks.join(', ')}</p>` : ''}
            </div>
          `;
          detailsEl.classList.remove('hidden');
        }
      } else {
        detailsEl.classList.add('hidden');
      }
    }

    async function addMember(e) {
      e.preventDefault();
      const msgEl = document.getElementById('add-msg');
      const submitBtn = document.getElementById('submit-add-btn');
      
      msgEl.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Creating...';

      const fullName = document.getElementById('new-fullname').value;
      const email = document.getElementById('new-email').value || null;
      const phone = document.getElementById('new-phone').value || null;
      const password = document.getElementById('new-password').value;
      const membershipId = document.getElementById('new-membership').value || null;

      if (!membershipId) {
        msgEl.textContent = '⚠️ Please select a membership plan';
        msgEl.className = 'text-sm text-red-600 dark:text-red-400';
        msgEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Member';
        return;
      }

      try {
        const { data: sessionData } = await sb.auth.getSession();
        const adminSession = sessionData?.session;

        const tempEmail = email || `${fullName.replace(/\s/g,'')}_${Date.now()}@temp.com`;
        const { data: authData, error: authError } = await sb.auth.signUp({
          email: tempEmail,
          password: password,
          options: { data: { full_name: fullName } }
        });

        if (authError) throw authError;

        if (!authData?.user) {
          throw new Error('Failed to create user');
        }

        if (adminSession) {
          await sb.auth.setSession({
            access_token: adminSession.access_token,
            refresh_token: adminSession.refresh_token
          });
        }

        const { error: updateError } = await sb
          .from('users')
          .update({
            gym_id: gymId,
            full_name: fullName,
            phone: phone,
            role: 'member'
          })
          .eq('id', authData.user.id);
        
        if (updateError) throw updateError;
        
        try {
          await sb.rpc('ensure_member_qr', {
            p_member_id: authData.user.id,
            p_gym_id: gymId
          });
        } catch (qrError) {
          console.error('QR error:', qrError);
        }
        
        if (membershipId) {
          const plan = memberships.find(m => m.id === membershipId);
          if (plan) {
            const endDate = new Date();
            endDate.setDate(endDate.getDate() + (plan.duration_months * 30));
            
            const { error: subError } = await sb
              .from('subscriptions')
              .insert({
                member_id: authData.user.id,
                membership_id: membershipId,
                gym_id: gymId,
                start_date: new Date().toISOString().split('T')[0],
                end_date: endDate.toISOString().split('T')[0],
                status: 'active',
                auto_renew: false
              });
            
            if (subError) console.error('Subscription error:', subError);
          }
        }

        msgEl.textContent = '✅ Member added successfully!';
        msgEl.className = 'text-sm text-green-600 dark:text-green-400';
        msgEl.classList.remove('hidden');
        
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Member';
        
        document.getElementById('add-member-form').reset();
        document.getElementById('plan-details').classList.add('hidden');
        
        setTimeout(() => {
          document.getElementById('add-member-modal').classList.add('hidden');
          msgEl.classList.add('hidden');
          fetchMembers();
        }, 1500);

      } catch (err) {
        console.error('Add member error:', err);
        msgEl.textContent = '❌ Error: ' + err.message;
        msgEl.className = 'text-sm text-red-600 dark:text-red-400';
        msgEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Add Member';
      }
    }

    async function fetchMembers() {
      document.getElementById('loading-state').classList.remove('hidden');
      document.getElementById('content').classList.add('hidden');

      const { data, error } = await sb
        .from('users')
        .select(`
          *,
          subscription:subscriptions(
            *,
            membership:memberships(*)
          ),
          member_qr_codes:member_qr_codes(qr_code, is_active)
        `)
        .eq('gym_id', gymId)
        .eq('role', 'member')
        .order('created_at', { ascending: false });

      if (error) console.error('Error fetching members:', error);
      allMembers = data || [];

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');
      renderMembers(document.getElementById('search-input').value);
      setTimeout(updatePageLanguage, 50);
    }

    function renderMembers(searchTerm) {
      const term = (searchTerm || '').toLowerCase();
      const statusFilter = document.getElementById('status-filter').value;
      
      const filtered = allMembers.filter((m) => {
        const matchSearch = 
          m.full_name?.toLowerCase().includes(term) ||
          m.email?.toLowerCase().includes(term) ||
          m.phone?.toLowerCase().includes(term);
        
        const sub = Array.isArray(m.subscription) ? m.subscription[0] : m.subscription;
        let matchStatus = true;
        if (statusFilter === 'active') {
          matchStatus = sub?.status === 'active';
        } else if (statusFilter === 'inactive') {
          matchStatus = sub?.status === 'inactive' || !sub;
        } else if (statusFilter === 'expired') {
          matchStatus = sub?.status === 'expired';
        }
        
        return matchSearch && matchStatus;
      });

      const lang = localStorage.getItem('gym_lang') || 'en';
      const noResultsText = lang === 'ar' ? 'لم يتم العثور على أعضاء' : 'No members found';
      const unknownText = lang === 'ar' ? 'عضو غير معروف' : 'Unknown Member';
      const noEmailText = lang === 'ar' ? 'لا يوجد بريد إلكتروني' : 'No email';
      const activeText = lang === 'ar' ? 'نشط' : 'Active';
      const inactiveText = lang === 'ar' ? 'غير نشط' : 'Inactive';
      const expiredText = lang === 'ar' ? 'منتهي' : 'Expired';
      const expiresText = lang === 'ar' ? 'ينتهي' : 'Expires';
      const showingText = lang === 'ar' ? 'عرض {count} من {total} عضو' : 'Showing {count} of {total} members';

      const el = document.getElementById('members-list');
      if (filtered.length === 0) {
        el.innerHTML = `<div class="text-center py-8 text-gray-500 dark:text-gray-400"><p>${noResultsText}</p></div>`;
      } else {
        el.innerHTML = filtered
          .map((m) => {
            const sub = Array.isArray(m.subscription) ? m.subscription[0] : m.subscription;
            const isActive = sub?.status === 'active';
            const isExpired = sub?.status === 'expired';
            
            let statusText = inactiveText;
            let statusClass = 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300';
            if (isActive) {
              statusText = activeText;
              statusClass = 'bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-400';
            } else if (isExpired) {
              statusText = expiredText;
              statusClass = 'bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-400';
            }
            
            const qr = Array.isArray(m.member_qr_codes) ? m.member_qr_codes[0] : m.member_qr_codes;
            
            let durationText = '';
            if (sub?.membership) {
              const months = sub.membership.duration_months;
              durationText = months === 1 ? 'شهر' : 
                            months === 2 ? 'شهرين' :
                            months === 3 ? 'ربع سنوي' :
                            months === 6 ? 'نصف سنوي' :
                            months === 12 ? 'سنوي' :
                            `${months} شهور`;
            }
            
            return `
            <div class="flex items-center justify-between p-4 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-xl font-bold text-blue-600 dark:text-blue-400">
                  ${getInitials(m.full_name)}
                </div>
                <div>
                  <p class="font-medium text-gray-900 dark:text-white">${m.full_name || unknownText}</p>
                  <div class="flex items-center gap-3 text-sm text-gray-500 dark:text-gray-400 flex-wrap">
                    <span>${m.email || noEmailText}</span>
                    ${m.phone ? `<span>📱 ${m.phone}</span>` : ''}
                  </div>
                  <div class="flex items-center gap-2 mt-1 flex-wrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusClass}">${statusText}</span>
                    ${sub ? `<span class="text-xs text-gray-500 dark:text-gray-400">${sub.membership?.name || ''}</span>` : ''}
                    ${sub ? `<span class="text-xs text-gray-400 dark:text-gray-500">${durationText}</span>` : ''}
                    ${sub ? `<span class="text-xs text-gray-400 dark:text-gray-500">${expiresText} ${formatDate(sub.end_date)}</span>` : ''}
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                ${qr ? `<button onclick="showMemberQR('${m.id}')" class="text-xs bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 px-3 py-1 rounded-full hover:bg-purple-200 dark:hover:bg-purple-900/50 transition-colors" title="QR Code">📱</button>` : ''}
                <button onclick="showMemberDetails('${m.id}')" class="text-xs bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 px-3 py-1 rounded-full hover:bg-blue-200 dark:hover:bg-blue-900/50 transition-colors">👁️</button>
                <button onclick="deleteMember('${m.id}')" class="text-xs bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 px-3 py-1 rounded-full hover:bg-red-200 dark:hover:bg-red-900/50 transition-colors">🗑️</button>
              </div>
            </div>`;
          })
          .join('');
      }

      document.getElementById('count-label').textContent = showingText.replace('{count}', filtered.length).replace('{total}', allMembers.length);
    }

    async function showMemberDetails(memberId) {
      const member = allMembers.find(m => m.id === memberId);
      if (!member) return;

      const sub = Array.isArray(member.subscription) ? member.subscription[0] : member.subscription;
      const qr = Array.isArray(member.member_qr_codes) ? member.member_qr_codes[0] : member.member_qr_codes;

      const { data: attendance } = await sb
        .from('attendance_logs')
        .select('*')
        .eq('user_id', memberId)
        .eq('gym_id', gymId)
        .order('check_in_time', { ascending: false })
        .limit(10);

      const { data: balance } = await sb.rpc('get_loyalty_balance', {
        p_member_id: memberId,
        p_gym_id: gymId
      });

      const lang = localStorage.getItem('gym_lang') || 'en';
      const unknownText = lang === 'ar' ? 'عضو غير معروف' : 'Unknown Member';
      const noEmailText = lang === 'ar' ? 'لا يوجد بريد إلكتروني' : 'No email';
      const planText = lang === 'ar' ? 'الخطة' : 'Plan';
      const statusText = lang === 'ar' ? 'الحالة' : 'Status';
      const pointsText = lang === 'ar' ? 'نقاط الولاء' : 'Points';
      const qrText = lang === 'ar' ? 'رمز QR' : 'QR Code';
      const subscriptionText = lang === 'ar' ? 'تفاصيل الاشتراك' : 'Subscription Details';
      const recentCheckinsText = lang === 'ar' ? 'آخر تسجيلات الحضور' : 'Recent Check-ins';
      const noCheckinsText = lang === 'ar' ? 'لا توجد تسجيلات حضور' : 'No check-ins yet';

      let durationText = '';
      if (sub?.membership) {
        const months = sub.membership.duration_months;
        durationText = months === 1 ? 'شهر' : 
                      months === 2 ? 'شهرين' :
                      months === 3 ? 'ربع سنوي' :
                      months === 6 ? 'نصف سنوي' :
                      months === 12 ? 'سنوي' :
                      `${months} شهور`;
      }

      const content = document.getElementById('member-details-content');
      content.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center gap-4 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
            <div class="w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-2xl font-bold text-blue-600 dark:text-blue-400">
              ${getInitials(member.full_name)}
            </div>
            <div>
              <h3 class="text-lg font-semibold text-gray-800 dark:text-white">${member.full_name || unknownText}</h3>
              <p class="text-sm text-gray-500 dark:text-gray-400">${member.email || noEmailText}</p>
              ${member.phone ? `<p class="text-sm text-gray-500 dark:text-gray-400">📱 ${member.phone}</p>` : ''}
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-blue-50 dark:bg-blue-900/30 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-blue-600 dark:text-blue-400">${sub?.membership?.name || 'None'}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">${planText}</p>
            </div>
            <div class="bg-green-50 dark:bg-green-900/30 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-green-600 dark:text-green-400">${sub?.status || 'None'}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">${statusText}</p>
            </div>
            <div class="bg-yellow-50 dark:bg-yellow-900/30 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-yellow-600 dark:text-yellow-400">${balance || 0}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">${pointsText}</p>
            </div>
            <div class="bg-purple-50 dark:bg-purple-900/30 p-3 rounded-lg text-center">
              <p class="text-lg font-bold text-purple-600 dark:text-purple-400">${qr ? '✅' : '❌'}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">${qrText}</p>
            </div>
          </div>

          ${sub ? `
            <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
              <h4 class="font-semibold text-gray-700 dark:text-gray-300 mb-2">${subscriptionText}</h4>
              <div class="grid grid-cols-2 gap-2 text-sm">
                <p><span class="text-gray-500 dark:text-gray-400">Plan:</span> ${sub.membership?.name || 'N/A'}</p>
                <p><span class="text-gray-500 dark:text-gray-400">Duration:</span> ${durationText}</p>
                <p><span class="text-gray-500 dark:text-gray-400">Price:</span> ${currencySymbol}${sub.membership?.price || 0}</p>
                <p><span class="text-gray-500 dark:text-gray-400">Status:</span> ${sub.status}</p>
                <p><span class="text-gray-500 dark:text-gray-400">Start:</span> ${formatDate(sub.start_date)}</p>
                <p><span class="text-gray-500 dark:text-gray-400">End:</span> ${formatDate(sub.end_date)}</p>
                <p><span class="text-gray-500 dark:text-gray-400">Auto Renew:</span> ${sub.auto_renew ? '✅' : '❌'}</p>
                ${sub.membership?.perks ? `<p class="col-span-2"><span class="text-gray-500 dark:text-gray-400">Perks:</span> ${sub.membership.perks.join(', ')}</p>` : ''}
              </div>
            </div>
          ` : ''}

          ${attendance && attendance.length > 0 ? `
            <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
              <h4 class="font-semibold text-gray-700 dark:text-gray-300 mb-2">${recentCheckinsText}</h4>
              <div class="space-y-1">
                ${attendance.slice(0, 5).map(a => `
                  <div class="flex items-center justify-between text-sm p-2 bg-gray-50 dark:bg-gray-700/50 rounded">
                    <span class="text-gray-700 dark:text-gray-300">${formatDateTime(a.check_in_time)}</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400">${a.method === 'qr_code' ? '📱 QR' : '✏️ Manual'}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : `
            <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
              <p class="text-sm text-gray-500 dark:text-gray-400 text-center">${noCheckinsText}</p>
            </div>
          `}

          ${qr ? `
            <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
              <h4 class="font-semibold text-gray-700 dark:text-gray-300 mb-2">QR Code</h4>
              <div class="flex items-center gap-4">
                <div id="detail-qr-canvas" class="bg-white dark:bg-gray-800 p-2 rounded border border-gray-200 dark:border-gray-700"></div>
                <div>
                  <p class="text-xs font-mono text-gray-500 dark:text-gray-400 break-all">${qr.qr_code}</p>
                  <button onclick="showMemberQR('${member.id}')" class="mt-2 text-sm bg-purple-600 hover:bg-purple-700 text-white px-4 py-1 rounded-lg">
                    View Full QR
                  </button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      if (qr && typeof QRCode !== 'undefined') {
        const container = document.getElementById('detail-qr-canvas');
        if (container) {
          container.innerHTML = '';
          new QRCode(container, {
            text: qr.qr_code,
            width: 100,
            height: 100
          });
        }
      }

      document.getElementById('member-details-modal').classList.remove('hidden');
    }

    async function showMemberQR(memberId) {
      const member = allMembers.find(m => m.id === memberId);
      if (!member) return;

      const qr = Array.isArray(member.member_qr_codes) ? member.member_qr_codes[0] : member.member_qr_codes;
      if (!qr) {
        try {
          await sb.rpc('ensure_member_qr', {
            p_member_id: memberId,
            p_gym_id: gymId
          });
          await fetchMembers();
          const updatedMember = allMembers.find(m => m.id === memberId);
          const newQr = Array.isArray(updatedMember?.member_qr_codes) ? updatedMember.member_qr_codes[0] : null;
          if (newQr) {
            displayQR(member, newQr.qr_code);
          }
        } catch (err) {
          alert('Error generating QR: ' + err.message);
        }
      } else {
        displayQR(member, qr.qr_code);
      }
    }

    function displayQR(member, qrCode) {
      document.getElementById('qr-member-name').textContent = member.full_name || 'Member';
      document.getElementById('qr-member-email').textContent = member.email || '';
      document.getElementById('qr-code-text').textContent = qrCode;
      currentQrMemberId = member.id;

      const container = document.getElementById('member-qr-canvas');
      container.innerHTML = '';
      
      if (typeof QRCode !== 'undefined') {
        new QRCode(container, {
          text: qrCode,
          width: 200,
          height: 200
        });
      }

      document.getElementById('member-qr-modal').classList.remove('hidden');
    }

    function downloadMemberQR() {
      const canvas = document.querySelector('#member-qr-canvas canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.download = `member-${currentQrMemberId}-qr.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    }

    async function deleteMember(memberId) {
      const member = allMembers.find(m => m.id === memberId);
      const lang = localStorage.getItem('gym_lang') || 'en';
      const confirmText = lang === 'ar' 
        ? `هل أنت متأكد من حذف ${member?.full_name || 'هذا العضو'}؟ لا يمكن التراجع عن هذا الإجراء.`
        : `Are you sure you want to delete ${member?.full_name || 'this member'}? This action cannot be undone.`;
      
      if (!confirm(confirmText)) return;
      
      try {
        // 1. حذف الاشتراكات
        await sb
          .from('subscriptions')
          .delete()
          .eq('member_id', memberId)
          .eq('gym_id', gymId);
        
        // 2. حذف سجل الحضور
        await sb
          .from('attendance_logs')
          .delete()
          .eq('user_id', memberId)
          .eq('gym_id', gymId);
        
        // 3. حذف نقاط الولاء
        await sb
          .from('loyalty_transactions')
          .delete()
          .eq('member_id', memberId)
          .eq('gym_id', gymId);
        
        // 4. حذف QR codes
        await sb
          .from('member_qr_codes')
          .delete()
          .eq('member_id', memberId)
          .eq('gym_id', gymId);
        
        // 5. حذف المدفوعات
        await sb
          .from('customer_purchases')
          .delete()
          .eq('customer_id', memberId)
          .eq('gym_id', gymId);
        
        // 6. حذف المستخدم
        const { error } = await sb
          .from('users')
          .delete()
          .eq('id', memberId)
          .eq('gym_id', gymId);
        
        if (error) throw error;
        
        showToast('✅ Member deleted successfully!', 'success');
        await fetchMembers();
        
      } catch (err) {
        console.error('Delete error:', err);
        alert('Error deleting member: ' + err.message);
      }
    }

    window.showMemberDetails = showMemberDetails;
    window.showMemberQR = showMemberQR;
    window.deleteMember = deleteMember;
    window.downloadMemberQR = downloadMemberQR;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
  <script>
  // تطبيق Dark Mode فوراً
  (function() {
    const isDark = localStorage.getItem('gym_theme') === 'dark';
    if (isDark) {
      document.body.classList.add('dark-mode');
    }
  })();
</script>
</body>
</html>
